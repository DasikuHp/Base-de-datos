// bad = sentencia con el fallo · ref = la correcta · why = ideas clave del porqué (una de cada grupo) · model = explicación modelo
BQ.DMLR = [
{id:'r-upd-nowhere', db:'huerto', kind:'write', title:'UPDATE sin WHERE', prompt:'Debe cambiar el nombre del vecino con DNI 12345678A a «María José».', bad:"UPDATE Vecino\nSET nombre_v_vecino = 'María José';", ref:"UPDATE Vecino SET nombre_v_vecino = 'María José' WHERE dni_vecino = '12345678A'", why:[['where','condicion','filtro','filtrar']], model:'Falta el <b>WHERE</b>: sin él el UPDATE cambia el nombre de <b>todos</b> los vecinos de la tabla. Debe terminar en <code>WHERE dni_vecino = \'12345678A\'</code>.', truco:'UPDATE y DELETE sin WHERE afectan a TODAS las filas. Escribe el WHERE primero.'},
{id:'r-del-nowhere', db:'huerto', kind:'write', title:'DELETE sin WHERE', prompt:'Debe eliminar solo la inscripción del vecino 12345678A al taller 1.', bad:"DELETE FROM Se_Apunta_A;", ref:"DELETE FROM Se_Apunta_A WHERE dni_vecino = '12345678A' AND id_taller = 1", why:[['where','condicion','filtro','filtrar','todas','todos','vacia']], model:'Sin <b>WHERE</b> se borran <b>todas</b> las inscripciones. Hay que identificar la fila con la clave completa: <code>WHERE dni_vecino = \'12345678A\' AND id_taller = 1</code>.', truco:'La PK compuesta necesita las DOS columnas en el WHERE.'},
{id:'r-null-eq', db:'instituto', kind:'select', title:'Comparar con NULL', prompt:'Debe mostrar los alumnos que no tienen teléfono.', bad:"SELECT *\nFROM alumno\nWHERE telefono = NULL;", ref:"SELECT * FROM alumno WHERE telefono IS NULL", why:[['is null'],['null','nulo','desconocido','ausente','vacio']], model:'<b>NULL no se compara con «=»</b>: cualquier comparación con NULL da NULL (desconocido) y no devuelve filas. Se escribe <code>telefono IS NULL</code>.', truco:'NULL: IS NULL / IS NOT NULL. Nunca = NULL.'},
{id:'r-agg-where', db:'ciclismo', kind:'select', title:'Agregado en el WHERE', prompt:'Debe mostrar los equipos con más de 5 ciclistas y cuántos tienen.', bad:"SELECT nomeq, COUNT(*)\nFROM ciclista\nWHERE COUNT(*) > 5\nGROUP BY nomeq;", ref:"SELECT nomeq, COUNT(*) FROM ciclista GROUP BY nomeq HAVING COUNT(*) > 5", why:[['having'],['where','agregad','count','funcion','grupo','agrupar','antes']], model:'<b>No se puede usar un agregado (COUNT) en el WHERE</b>: WHERE filtra filas antes de agrupar. Un filtro sobre el resultado de un grupo va en <b>HAVING</b>, después del GROUP BY.', truco:'WHERE filtra filas · HAVING filtra grupos.'},
{id:'r-no-group', db:'huerto', kind:'select', title:'Falta el GROUP BY', prompt:'Debe mostrar cuántas parcelas tiene cada vecino (dni_vecino y la cuenta).', bad:"SELECT dni_vecino, COUNT(*)\nFROM Parcela;", ref:"SELECT dni_vecino, COUNT(*) FROM Parcela GROUP BY dni_vecino", why:[['group by'],['agrup','columna','sin agregad','dni_vecino','cada vecino','por vecino']], model:'Falta <b>GROUP BY dni_vecino</b>. Mezclar una columna normal con COUNT(*) sin agrupar no tiene sentido (MySQL da error por ONLY_FULL_GROUP_BY): hay que decir por qué columna se agrupa.', truco:'Columna normal + agregado en el SELECT → esa columna va en el GROUP BY.'},
{id:'r-like-nowild', db:'huerto', kind:'select', title:'LIKE sin comodín', prompt:'Debe mostrar los vecinos cuyo primer apellido empieza por G.', bad:"SELECT *\nFROM Vecino\nWHERE apellido1_vecino LIKE 'G';", ref:"SELECT * FROM Vecino WHERE apellido1_vecino LIKE 'G%'", why:[['%','comodin','wildcard','patron'],['empieza','cualquier','resto','igual','exacto','solo','letra g']], model:'Sin el comodín <b>%</b>, <code>LIKE \'G\'</code> equivale a <code>= \'G\'</code>: solo encontraría un apellido que sea exactamente «G». Hay que escribir <code>LIKE \'G%\'</code>.', truco:'% = cualquier cosa (0 o más caracteres) · _ = exactamente un carácter.'},
{id:'r-order-asc', db:'huerto', kind:'select', title:'Las 3 mayores… ¿o las 3 menores?', prompt:'Debe mostrar las 3 parcelas más grandes (id_parcela, metros, orientacion, dni_vecino).', bad:"SELECT id_parcela, metros, orientacion, dni_vecino\nFROM Parcela\nORDER BY metros\nLIMIT 3;", ref:"SELECT id_parcela, metros, orientacion, dni_vecino FROM Parcela ORDER BY metros DESC LIMIT 3", why:[['desc','descendente','mayor a menor','orden inverso','al reves'],['asc','menor','menores','pequen','ascendente','por defecto']], model:'<code>ORDER BY metros</code> ordena de <b>menor a mayor</b> (ASC por defecto) y LIMIT 3 se queda con las 3 <b>más pequeñas</b>. Hace falta <code>ORDER BY metros DESC</code>.', truco:'"Los N mayores" = ORDER BY ... DESC LIMIT N.'},
{id:'r-clause-order', db:'huerto', kind:'select', title:'Cláusulas desordenadas', prompt:'Debe mostrar las 3 parcelas más grandes (id_parcela, metros, orientacion, dni_vecino).', bad:"SELECT id_parcela, metros, orientacion, dni_vecino\nFROM Parcela\nLIMIT 3\nORDER BY metros DESC;", ref:"SELECT id_parcela, metros, orientacion, dni_vecino FROM Parcela ORDER BY metros DESC LIMIT 3", why:[['orden','antes','despues','posicion','sintaxis','detras'],['limit']], model:'<b>Orden de las cláusulas</b>: ORDER BY va <b>antes</b> que LIMIT (SELECT · FROM · WHERE · GROUP BY · HAVING · ORDER BY · LIMIT). Escrito así es un error de sintaxis.', truco:'SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT.'},
{id:'r-insert-order', db:'huerto', kind:'write', title:'INSERT con los valores cambiados', prompt:'Debe dar de alta al vecino 67890123F, Pablo Gil.', bad:"INSERT INTO Vecino (dni_vecino, nombre_v_vecino, apellido1_vecino)\nVALUES ('Pablo', '67890123F', 'Gil');", ref:"INSERT INTO Vecino (dni_vecino, nombre_v_vecino, apellido1_vecino) VALUES ('67890123F', 'Pablo', 'Gil')", why:[['orden','posicion','mismo orden','corresponde','cambiad','intercambiad','columnas'],['valor','dni','nombre']], model:'Los valores de <code>VALUES</code> deben ir <b>en el mismo orden</b> que las columnas indicadas: aquí «Pablo» se asigna a <code>dni_vecino</code> y el DNI a <code>nombre_v_vecino</code>. Debe ser <code>VALUES (\'67890123F\', \'Pablo\', \'Gil\')</code>.', truco:'La 1ª columna recibe el 1er valor, la 2ª el 2º…'},
{id:'r-between-rev', db:'huerto', kind:'select', title:'BETWEEN al revés', prompt:'Debe mostrar las parcelas con superficie entre 20 y 30 m² (ambas incluidas).', bad:"SELECT id_parcela, metros\nFROM Parcela\nWHERE metros BETWEEN 30 AND 20;", ref:"SELECT id_parcela, metros FROM Parcela WHERE metros BETWEEN 20 AND 30", why:[['menor','primero','orden','revés','reves','invertid','limite','extremo','al reves'],['mayor','segundo','30','20','nada','ninguna','vacio','no devuelve']], model:'<code>BETWEEN a AND b</code> exige <b>a ≤ b</b> (primero el valor menor). Con 30 AND 20 el rango es imposible y no devuelve ninguna fila. Debe ser <code>BETWEEN 20 AND 30</code>.', truco:'BETWEEN menor AND mayor (incluye los dos).'},
{id:'r-or-prec', db:'huerto', kind:'select', title:'AND/OR sin paréntesis', prompt:'Debe mostrar las parcelas orientadas al Sur o al Este que tengan MÁS de 30 m².', bad:"SELECT id_parcela, metros, orientacion\nFROM Parcela\nWHERE orientacion = 'Sur' OR orientacion = 'Este' AND metros > 30;", ref:"SELECT id_parcela, metros, orientacion FROM Parcela WHERE (orientacion = 'Sur' OR orientacion = 'Este') AND metros > 30", why:[['parentesis'],['and','or','prioridad','precedencia','antes','primero','se evalua']], model:'<b>AND tiene más prioridad que OR</b>: la condición se lee «Sur, o (Este y más de 30)». Se necesitan <b>paréntesis</b>: <code>(orientacion = \'Sur\' OR orientacion = \'Este\') AND metros > 30</code> (o <code>IN (\'Sur\',\'Este\')</code>).', truco:'Mezclas AND y OR → paréntesis siempre.'},
{id:'r-quotes', db:'huerto', kind:'select', title:'Texto sin comillas', prompt:"Debe mostrar el vecino con DNI '12345678A'.", bad:"SELECT *\nFROM Vecino\nWHERE dni_vecino = 12345678A;", ref:"SELECT * FROM Vecino WHERE dni_vecino = '12345678A'", why:[['comilla','entrecomill','cadena','texto','string','literal']], model:'El DNI es <b>texto</b> y debe ir <b>entre comillas simples</b>: <code>\'12345678A\'</code>. Sin comillas MySQL intenta interpretarlo como un número o una columna y da error.', truco:'Texto y fechas entre comillas simples; los números, sin ellas.'},
{id:'r-alias-where', db:'instituto', kind:'select', title:'Alias en el WHERE', prompt:'Debe mostrar nombre y año de nacimiento de los alumnos nacidos entre 1990 y 1999.', bad:"SELECT nombre, YEAR(fecha_nacimiento) AS anio\nFROM alumno\nWHERE anio BETWEEN 1990 AND 1999;", ref:"SELECT nombre, YEAR(fecha_nacimiento) AS anio FROM alumno WHERE YEAR(fecha_nacimiento) BETWEEN 1990 AND 1999", why:[['alias'],['where','antes','select','todavia','existe','no se puede','no se conoce']], model:'<b>Un alias del SELECT no se puede usar en el WHERE</b>: MySQL evalúa el WHERE antes de calcular el SELECT y el alias aún no existe. Hay que repetir la expresión: <code>WHERE YEAR(fecha_nacimiento) BETWEEN 1990 AND 1999</code>.', truco:'Orden de ejecución: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.'},
{id:'r-count-col', db:'instituto', kind:'select', title:'COUNT(columna) vs COUNT(*)', prompt:'Debe mostrar cuántos alumnos hay en total.', bad:"SELECT COUNT(telefono)\nFROM alumno;", ref:"SELECT COUNT(*) FROM alumno", why:[['null','nulo','vacio','sin telefono','no cuenta','ignora'],['count(*)','todas las filas','total','filas']], model:'<code>COUNT(telefono)</code> <b>no cuenta los NULL</b>: solo cuenta los alumnos que tienen teléfono. Para contar filas se usa <code>COUNT(*)</code>.', truco:'COUNT(*) cuenta filas · COUNT(col) cuenta valores NO nulos.'},
{id:'r-concat-or', db:'instituto', kind:'select', title:'Concatenar con ||', prompt:"Debe mostrar el nombre y el primer apellido unidos con un espacio en una columna llamada nombre_completo.", bad:"SELECT nombre || ' ' || apellido1 AS nombre_completo\nFROM alumno;", ref:"SELECT CONCAT(nombre, ' ', apellido1) AS nombre_completo FROM alumno", aliases:['nombre_completo'], why:[['concat'],['||','or','logico','operador','no concatena','mysql']], model:'En MySQL <code>||</code> es el operador <b>OR lógico</b>, no concatena (devuelve 0 o 1). Se usa <code>CONCAT(nombre, \' \', apellido1)</code>.', truco:'Concatenar en MySQL = CONCAT(...). || es un OR.'},
{id:'r-set-and', db:'huerto', kind:'write', title:'SET con AND', prompt:'Debe cambiar el nombre a «Marta» y el primer apellido a «Gil» del vecino 12345678A.', bad:"UPDATE Vecino\nSET nombre_v_vecino = 'Marta' AND apellido1_vecino = 'Gil'\nWHERE dni_vecino = '12345678A';", ref:"UPDATE Vecino SET nombre_v_vecino = 'Marta', apellido1_vecino = 'Gil' WHERE dni_vecino = '12345678A'", why:[['coma','comas'],['and','separ','varias','dos columnas','asignacion']], model:'En el <code>SET</code> las asignaciones se separan con <b>comas</b>, no con AND. Con AND MySQL calcula <code>\'Marta\' AND apellido1_vecino = \'Gil\'</code> (un valor lógico) y lo guarda en el nombre.', truco:'SET a = 1, b = 2 (comas). AND solo en el WHERE.'},
{id:'r-missing-comma', db:'huerto', kind:'select', title:'Falta una coma', prompt:'Debe mostrar el DNI y el nombre de cada vecino (dos columnas).', bad:"SELECT dni_vecino nombre_v_vecino\nFROM Vecino;", ref:"SELECT dni_vecino, nombre_v_vecino FROM Vecino", why:[['coma'],['alias','una columna','solo','dos columnas','renombra']], model:'Falta la <b>coma</b> entre las columnas: MySQL entiende que <code>nombre_v_vecino</code> es un <b>alias</b> de <code>dni_vecino</code> y devuelve una sola columna (el DNI con otro nombre).', truco:'Columnas del SELECT separadas por comas. Sin coma = alias.'},
{id:'r-del-parent', db:'huerto', kind:'write', title:'Borrar un padre con hijos', prompt:'Debe eliminar al vecino con DNI 23456789B (que tiene una parcela).', bad:"DELETE FROM Vecino\nWHERE dni_vecino = '23456789B';", ref:["DELETE FROM Parcela WHERE dni_vecino = '23456789B'; DELETE FROM Vecino WHERE dni_vecino = '23456789B'"], why:[['parcela','hijo','hija','dependen','referencia'],['clave ajena','foreign','fk','restrict','integridad','antes','primero','no deja','no permite']], model:'El vecino tiene <b>parcelas</b> que lo referencian con una <b>clave ajena (RESTRICT)</b>: MySQL no deja borrar al «padre» mientras existan «hijos». Hay que borrar antes las parcelas (<code>DELETE FROM Parcela WHERE dni_vecino = \'23456789B\'</code>) y después el vecino.', truco:'Se borra primero lo que depende (hijos) y luego lo referenciado (padre).'},

// BDA-QUEST · contenido SOLO para el modo papel: E/R de los boletines (con solución propuesta),
// cardinalidades, normalización y los DML de los boletines que faltaban.
// Convención de clase: el par (min,max) va pegado a la entidad que se cuenta.
window.BQ = window.BQ || {};
(function () {
const P = s => [s[0], s[1]];                         // '0N' -> ['0','N']
const sing = {'0,1': 'como mucho 1', '1,1': 'exactamente 1', '0,N': '0 o varios', '1,N': '1 o varios'};
const R = (a, verb, b, na, nb, extra) => Object.assign({a, verb, b, na: P(na), nb: P(nb), tipo: (na[1] === 'N' && nb[1] === 'N') ? 'N:M' : (na[1] === 'N' || nb[1] === 'N') ? '1:N' : '1:1',
  why: `Junto a ${a}: ${sing[P(na).join()]} ${a.toLowerCase()} por cada ${b.toLowerCase()}. Junto a ${b}: ${sing[P(nb).join()]} ${b.toLowerCase()} por cada ${a.toLowerCase()}.`}, extra || {});
// tablas en notación compacta:  NOMBRE = col*, col!, col?, col+!, col!->TABLA, col*->TABLA#grupo
//   * CP · + C.Alt · ! obligatorio · ? opcional · ->T clave ajena (#n agrupa FKs compuestas)
const T = line => { const [name, rest] = line.split(' = '); return {name: name.trim(), cols: rest.split(',').map(s => {
  const m = /^\s*([A-Za-z0-9_]+)([*+!?]*)(?:->([A-Z_0-9]+)(?:#(\d))?)?\s*$/.exec(s); if (!m) throw new Error('col ' + s);
  const f = m[2]; return [m[1], (f.includes('*') ? 'P' : '') + (f.includes('+') ? 'A' : '') + (f.includes('!') ? 'V' : '') + (f.includes('?') ? 'o' : ''), m[3], undefined, m[4]]; })}; };

// ---------- normalización (Boletín normalización) ----------
BQ.NORM = [
{id:'n-1', title:'Ej. 1 · hasta 1FN', q:'Normaliza hasta 1FN: <code>X = a0 + a1 + {x + y + z}</code>', hints:['1FN = valores atómicos: nada de grupos repetidos {…}.','El grupo repetido {x+y+z} sale a otra tabla.','La nueva tabla lleva la clave de X (a0) para poder volver.'],
 sol:'<pre class="code">X1 = a0 + a1            CP(a0)\nX2 = a0 + x + y + z     CP(a0, x)   C.Aj(a0) → X1\n(si x no identifica cada repetición, CP(a0, x, y, z))</pre>', rub:['Saco el grupo repetido {x+y+z} a otra tabla','La nueva tabla incluye a0 como C.Aj hacia X1','CP de la nueva tabla compuesta con a0']},
{id:'n-2', title:'Ej. 2 · hasta 2FN', q:'Normaliza hasta 2FN: <code>A = a0 + {a1 + a2} + c + d</code> con <code>DF = {a1 → a2, c → d}</code>', hints:['Primero 1FN: saca el grupo repetido.','2FN: ¿algún atributo depende solo de una PARTE de la clave compuesta?','a1 → a2 es dependencia parcial en la tabla del grupo.'],
 sol:'<pre class="code">1FN:  A1 = a0 + c + d        CP(a0)\n      A2 = a0 + a1 + a2      CP(a0, a1)\n2FN:  A2a = a1 + a2          CP(a1)            (a1 → a2)\n      A2b = a0 + a1          CP(a0, a1)  C.Aj(a1) → A2a\n      A1 se queda (c → d es transitiva: eso es 3FN, no 2FN)</pre>', rub:['Hago 1FN sacando {a1+a2}','Detecto la dependencia parcial a1 → a2','Separo A2a(a1,a2) y A2b(a0,a1) con su C.Aj','No toco c → d (es de 3FN)']},
{id:'n-3', title:'Ej. 3 (c y d) · DFs y FNBC de las piezas', q:'Con el esquema de <b>piezas de ferretería</b> (ver su E/R y tablas en la sección E/R): busca las dependencias funcionales no triviales y normaliza hasta FNBC.', hints:['Una DF por cada determinante: la clave de cada tabla y cualquier otro atributo que determine algo.','«Un mismo tipo siempre tiene el mismo nombre»: tipo → nombre.','Comprueba que todo determinante es clave en su tabla.'],
 sol:'<pre class="code">DF:  tipo → nombre\n     (tipo, modelo) → descripcion, precio, cod_estanteria, cantidad\n     cod_estanteria → posicion, num_estantes, peso_max, pct_libre, id_almacen\n     id_almacen → descripcion, direccion\n     (tipo_p, modelo_p, tipo_c, modelo_c) → cantidad\nFNBC: TIPO_PIEZA(tipo, nombre) · PIEZA(tipo, modelo, descripcion, precio, cod_estanteria, cantidad)\n      ESTANTERIA(cod_estanteria, posicion, num_estantes, peso_max, pct_libre, id_almacen)\n      ALMACEN(id_almacen, descripcion, direccion) · COMPOSICION(...)\n(tipo → nombre ya está separada: PIEZA no repite el nombre)</pre>', rub:['Encuentro tipo → nombre','Encuentro cod_estanteria → … y id_almacen → …','Compruebo que todos los determinantes son clave']},
{id:'n-4', title:'Ej. 4 · concurso enológico', q:'<pre class="code">CATADORES = dniCatador + nombre + experiencia + dnipareja\nVINOS = codBarras + añada + precio + bodega\nCOMPOSICIÓN = codBarras + tipoUva + porcentaje\nCATAS = dniCatador + CodBarras + notaAromas + notaSabor + tipoVino</pre>a) Deduce las DF. b) Normaliza hasta FNBC. c) ¿Puedes unificar tablas?', hints:['Una DF por tabla: la clave determina el resto.','¿De qué depende el tipoVino: del catador+vino o solo del vino?','Si depende solo de codBarras es una dependencia PARCIAL en CATAS.'],
 sol:'<pre class="code">DF: dniCatador → nombre, experiencia, dnipareja\n    codBarras → añada, precio, bodega, tipoVino\n    (codBarras, tipoUva) → porcentaje\n    (dniCatador, codBarras) → notaAromas, notaSabor\nFNBC: CATADORES(dniCatador, nombre, experiencia, dnipareja)  C.Aj(dnipareja) → CATADORES\n      VINOS(codBarras, añada, precio, bodega, tipoVino)\n      COMPOSICION(codBarras, tipoUva, porcentaje)\n      CATAS(dniCatador, codBarras, notaAromas, notaSabor)\nc) tipoVino pasa de CATAS a VINOS (dependía solo de codBarras). Las demás tablas tienen claves distintas: no se unifican.</pre>', rub:['Escribo las 4 DF de las claves','Detecto codBarras → tipoVino (dependencia parcial en CATAS)','Muevo tipoVino a VINOS','Explico por qué no se unifican más tablas']},
{id:'n-5', title:'Ej. 5 · alumnos de un IES', q:'<code>ALUMNO = Expediente + Nombre + Ape1 + Ape2 + DNI + NSS + calle + municipio + provincia + CP</code><br>a) Claves candidatas. b) Elige CP y alternativas. c) DFs. d) Hasta FNBC.', hints:['Candidata = identifica a cada alumno sin repetirse: ¿cuáles?','CP → municipio, provincia (un código postal pertenece a un municipio).','El determinante CP no es clave de ALUMNO: dependencia transitiva.'],
 sol:'<pre class="code">a) Expediente, DNI, NSS\nb) CP(Expediente)  C.Alt(DNI)  C.Alt(NSS)\nc) Expediente → todo · DNI → todo · NSS → todo\n   CP → municipio, provincia · municipio → provincia\nd) ALUMNO(Expediente, Nombre, Ape1, Ape2, DNI, NSS, calle, CP)  C.Aj(CP)\n   CODIGO_POSTAL(CP, municipio)  C.Aj(municipio)\n   MUNICIPIO(municipio, provincia)</pre>', rub:['Las 3 claves candidatas','CP elegida y 2 alternativas','Detecto CP → municipio y municipio → provincia','Separo las tablas hasta FNBC']},
{id:'n-6a', title:'Ej. 6a', q:'<code>ALUMNOS = expediente + nombre + apellido + {teléfono} + dirección</code>', hints:['Hay un grupo repetido: {teléfono}.'], sol:'<pre class="code">ALUMNOS(expediente, nombre, apellido, dirección)\nTELEFONOS(expediente, teléfono)   CP(expediente, teléfono)   C.Aj(expediente) → ALUMNOS</pre>', rub:['Saco {teléfono} a otra tabla','CP compuesta y C.Aj a ALUMNOS']},
{id:'n-6b', title:'Ej. 6b', q:'<code>ALUMNOS = expediente + nombre + apellido + {asignatura + nota + curso + aula}</code> con <code>DF = {asignatura → curso, curso → aula}</code>', hints:['1FN: saca el grupo.','2FN: curso depende solo de asignatura (parte de la clave).','3FN: curso → aula es transitiva.'],
 sol:'<pre class="code">ALUMNOS(expediente, nombre, apellido)\nNOTAS(expediente, asignatura, nota)      CP(expediente, asignatura)\nASIGNATURAS(asignatura, curso)           C.Aj(curso) → CURSOS\nCURSOS(curso, aula)</pre>', rub:['1FN: saco el grupo repetido','2FN: asignatura → curso sale de NOTAS','3FN: curso → aula en tabla aparte']},
{id:'n-6c', title:'Ej. 6c', q:'<code>LIBROS = ISBN + título + editorial + país</code> (la editorial determina el país)', hints:['Dependencia transitiva: ISBN → editorial → país.'], sol:'<pre class="code">LIBROS(ISBN, título, editorial)   C.Aj(editorial) → EDITORIALES\nEDITORIALES(editorial, país)</pre>', rub:['Detecto editorial → país','Separo EDITORIALES']},
{id:'n-6d', title:'Ej. 6d', q:'<code>PERSONAS = DNI + Nombre + Apellidos + Dirección + CP + Población + Provincia</code>', hints:['CP → población, provincia.'], sol:'<pre class="code">PERSONAS(DNI, Nombre, Apellidos, Dirección, CP)   C.Aj(CP) → CODIGOS_POSTALES\nCODIGOS_POSTALES(CP, Población, Provincia)</pre>', rub:['Detecto CP → población, provincia','Separo CODIGOS_POSTALES']},
{id:'n-6e', title:'Ej. 6e', q:'<code>EMPLEADOS = DNI + NSS + Nombre + apellidos + departamento + puesto + salario</code>, C.Alt: NSS, <code>DF = {puesto → salario}</code>', hints:['puesto → salario: el determinante no es clave.'], sol:'<pre class="code">EMPLEADOS(DNI, NSS, Nombre, apellidos, departamento, puesto)   C.Alt(NSS)   C.Aj(puesto) → PUESTOS\nPUESTOS(puesto, salario)</pre>', rub:['Separo puesto → salario','Mantengo C.Alt(NSS)']},
{id:'n-6f', title:'Ej. 6f', q:'<code>FIGURAS = nombre + color + tamaño</code>, C.Alt: color + tamaño, <code>DF = {tamaño → nombre}</code>', hints:['¿nombre forma parte de alguna clave candidata? Si sí, está en 3FN, pero no en FNBC.','FNBC: todo determinante debe ser clave.'], sol:'<pre class="code">3FN: ya cumple (nombre es atributo primo).\nFNBC: TAMAÑOS(tamaño, nombre)   FIGURAS(color, tamaño)   C.Aj(tamaño) → TAMAÑOS\n(se pierde la DF nombre+color → tamaño: es el caso clásico en que FNBC no conserva todas las DF)</pre>', rub:['Explico que está en 3FN pero no en FNBC','Separo TAMAÑOS(tamaño, nombre)','Comento la pérdida de una DF']},
{id:'n-7', title:'Ej. 7 · ventas', q:'<code>VENTAS = fecha + vendedor + cliente + producto + NombreProducto + costeProducto + margenProducto + cantidadVendida + precioUnidad + importeBase + tipoIVA + %IVA + importeIVA + importeTotal + %comision + importeComision + ganancia</code><br>Cada vendedor tiene un único % de comisión; cada producto un único precio, coste y margen; cada tipo de IVA un único %. Se guardan los importes calculados por eficiencia. a) DFs. b) FNBC sin perder rendimiento.', hints:['Tres determinantes claros: vendedor, producto, tipoIVA.','Los importes calculados se quedan en VENTAS a propósito (rendimiento).'],
 sol:'<pre class="code">DF: vendedor → %comision\n    producto → NombreProducto, costeProducto, margenProducto, precioUnidad\n    tipoIVA → %IVA\n    (fecha, vendedor, cliente, producto) → cantidadVendida, tipoIVA y los importes\nFNBC: VENDEDORES(vendedor, %comision)\n      PRODUCTOS(producto, NombreProducto, costeProducto, margenProducto, precioUnidad)\n      IVA(tipoIVA, %IVA)\n      VENTAS(fecha, vendedor, cliente, producto, cantidadVendida, importeBase, tipoIVA,\n             importeIVA, importeTotal, importeComision, ganancia)\nLos importes calculados se mantienen en VENTAS (desnormalización consciente).</pre>', rub:['Tres DF: vendedor, producto, tipoIVA','Separo VENDEDORES, PRODUCTOS e IVA','Mantengo los importes calculados en VENTAS y lo justifico']},
{id:'n-8', title:'Ej. 8 · videoclub', q:'<code>AT = Película + Director + { Ejemplar + estado + {Fecha + Socio} }</code> con <code>DF = {Ejemplar → Película, Película → Director}</code>. Pasa a FNBC.', hints:['Hay dos grupos repetidos anidados.','Ejemplar → Película: cada ejemplar es de una película.'], sol:'<pre class="code">PELICULAS(Película, Director)\nEJEMPLARES(Ejemplar, Película, estado)     C.Aj(Película) → PELICULAS\nALQUILERES(Ejemplar, Fecha, Socio)         CP(Ejemplar, Fecha)   C.Aj(Ejemplar) → EJEMPLARES</pre>', rub:['Saco los dos grupos repetidos','PELICULAS(Película, Director)','EJEMPLARES con su C.Aj','ALQUILERES con CP (Ejemplar, Fecha)']}
];

{id:'s1', lvl:1, tags:['1 tabla'], title:'Base de datos y tabla alumno', q:'Crea la base de datos «instituto» (si ya existe, se elimina antes) y selecciónala. Crea la tabla <code>alumno</code>: id (clave primaria autoincremental), nombre y apellido1 obligatorios, apellido2 opcional, fecha_nacimiento obligatoria, es_repetidor (solo «sí» o «no», obligatorio) y teléfono opcional de 9 caracteres.',
 sol:"DROP DATABASE IF EXISTS instituto;\nCREATE DATABASE instituto;\nUSE instituto;\n\nCREATE TABLE alumno (\n  id               INT AUTO_INCREMENT PRIMARY KEY,\n  nombre           VARCHAR(100) NOT NULL,\n  apellido1        VARCHAR(100) NOT NULL,\n  apellido2        VARCHAR(100),\n  fecha_nacimiento DATE NOT NULL,\n  es_repetidor     ENUM('sí','no') NOT NULL,\n  telefono         VARCHAR(9)\n);",
 hints:['Tres órdenes: DROP DATABASE IF EXISTS, CREATE DATABASE, USE.','Lo opcional (apellido2, teléfono) no lleva NOT NULL.','Un campo con solo dos valores posibles: ENUM.'], rub:['DROP DATABASE IF EXISTS + CREATE DATABASE + USE','id INT AUTO_INCREMENT PRIMARY KEY','NOT NULL solo en nombre, apellido1, fecha_nacimiento y es_repetidor','apellido2 y telefono sin NOT NULL','es_repetidor como ENUM(\'sí\',\'no\')','Tabla en singular']},
{id:'s2', lvl:1, tags:['2 tablas','existencia'], title:'Cliente y pedido (existencialidad)', q:'Una tienda guarda clientes y pedidos. Cliente: dni (lo identifica), nombre y email obligatorios, el email no puede repetirse. Pedido: número (clave autoincremental), fecha obligatoria y el cliente que lo hace. <b>Todo pedido pertenece a un único cliente</b> (obligatorio); un cliente puede no tener pedidos.',
 sol:"CREATE TABLE cliente (\n  dni     CHAR(9) PRIMARY KEY,\n  nombre  VARCHAR(80) NOT NULL,\n  email   VARCHAR(120) NOT NULL UNIQUE\n);\n\nCREATE TABLE pedido (\n  numero       INT AUTO_INCREMENT PRIMARY KEY,\n  fecha        DATE NOT NULL,\n  dni_cliente  CHAR(9) NOT NULL,\n  FOREIGN KEY (dni_cliente) REFERENCES cliente(dni)\n);",
 hints:['Primero cliente (a quien apunta pedido), después pedido.','El email no se repite: UNIQUE (y NOT NULL porque es obligatorio).','«Todo pedido pertenece a un cliente» → la FK es NOT NULL (restricción de existencia).'], rub:['cliente se crea antes que pedido','dni es PRIMARY KEY','email NOT NULL UNIQUE','FOREIGN KEY (dni_cliente) REFERENCES cliente(dni)','dni_cliente NOT NULL (existencia: pedido siempre tiene cliente)','Mismo tipo en la FK y en la clave referenciada']},
{id:'s3', lvl:1, tags:['2 tablas'], title:'Vecino y parcela (huerto)', q:'Vecino: dni_vecino (CP), nombre y apellido1 obligatorios, apellido2 opcional. Parcela: id (autoincremental), metros (decimal de 6 cifras con 2 decimales, obligatorio), orientación (Norte, Sur, Este u Oeste, obligatoria) y el vecino dueño (obligatorio). Los metros deben ser mayores que 0.',
 sol:"CREATE TABLE vecino (\n  dni_vecino        VARCHAR(9) PRIMARY KEY,\n  nombre_vecino     VARCHAR(50) NOT NULL,\n  apellido1_vecino  VARCHAR(50) NOT NULL,\n  apellido2_vecino  VARCHAR(50)\n);\n\nCREATE TABLE parcela (\n  id_parcela   INT AUTO_INCREMENT PRIMARY KEY,\n  metros       DECIMAL(6,2) NOT NULL,\n  orientacion  ENUM('Norte','Sur','Este','Oeste') NOT NULL,\n  dni_vecino   VARCHAR(9) NOT NULL,\n  FOREIGN KEY (dni_vecino) REFERENCES vecino(dni_vecino),\n  CHECK (metros > 0)\n);",
 hints:['DECIMAL(6,2): 6 cifras en total, 2 decimales.','La restricción de rango se escribe con CHECK.','El dueño es obligatorio: FK NOT NULL.'], rub:['vecino antes que parcela','PRIMARY KEY en vecino y AUTO_INCREMENT en parcela','DECIMAL(6,2) NOT NULL y ENUM NOT NULL','FK dni_vecino NOT NULL hacia vecino','CHECK (metros > 0)','apellido2 sin NOT NULL']},
{id:'s4', lvl:2, tags:['2 tablas','acciones FK'], title:'Monitor y taller con acciones en la FK', q:'Monitor: dni_monitor (CP), nombre y apellido1 obligatorios. Taller: id (autoincremental), equipo y fecha de celebración obligatorios y el monitor que lo imparte (obligatorio). Si se cambia el DNI de un monitor debe actualizarse en sus talleres, y <b>no se puede borrar</b> un monitor que imparta talleres.',
 sol:"CREATE TABLE monitor (\n  dni_monitor      VARCHAR(9) PRIMARY KEY,\n  nombre_monitor   VARCHAR(50) NOT NULL,\n  apellido1        VARCHAR(50) NOT NULL\n);\n\nCREATE TABLE taller (\n  id_taller        INT AUTO_INCREMENT PRIMARY KEY,\n  equipo           VARCHAR(100) NOT NULL,\n  fecha_celebrado  DATE NOT NULL,\n  dni_monitor      VARCHAR(9) NOT NULL,\n  FOREIGN KEY (dni_monitor) REFERENCES monitor(dni_monitor)\n    ON UPDATE CASCADE\n    ON DELETE RESTRICT\n);",
 hints:['ON UPDATE CASCADE propaga el cambio de clave.','ON DELETE RESTRICT impide borrar al padre con hijos.'], rub:['monitor antes que taller','FK dni_monitor NOT NULL','ON UPDATE CASCADE','ON DELETE RESTRICT']},
{id:'s5', lvl:2, tags:['3 tablas','N:M'], title:'Inscripciones (N:M)', q:'Un vecino puede apuntarse a varios talleres y un taller tiene varios vecinos. Se guarda la fecha de alta de cada inscripción (obligatoria). Crea la tabla <code>se_apunta_a</code> (vecino y taller ya existen: vecino con dni_vecino, taller con id_taller). Al borrar un vecino o un taller, sus inscripciones se borran también.',
 sol:"CREATE TABLE se_apunta_a (\n  dni_vecino  VARCHAR(9) NOT NULL,\n  id_taller   INT NOT NULL,\n  fecha_alta  DATE NOT NULL,\n  PRIMARY KEY (dni_vecino, id_taller),\n  FOREIGN KEY (dni_vecino) REFERENCES vecino(dni_vecino) ON DELETE CASCADE,\n  FOREIGN KEY (id_taller) REFERENCES taller(id_taller) ON DELETE CASCADE\n);",
 hints:['N:M → tabla intermedia con las dos FKs.','La CP es compuesta y se escribe una sola vez: PRIMARY KEY (a, b).','ON DELETE CASCADE borra los hijos.'], rub:['PRIMARY KEY compuesta (dni_vecino, id_taller)','Dos FOREIGN KEY, una a cada tabla','fecha_alta NOT NULL (atributo de la relación)','ON DELETE CASCADE en las dos FKs']},
{id:'s6', lvl:1, tags:['ALTER'], title:'ALTER TABLE: añadir una columna', q:'La tabla <code>vecino</code> ya existe. Añade una columna <code>telefono</code> de hasta 20 caracteres que pueda quedar sin valor.', sol:"ALTER TABLE vecino\n  ADD COLUMN telefono VARCHAR(20) NULL;", hints:['No recrees la tabla: ALTER TABLE + ADD COLUMN.'], rub:['ALTER TABLE vecino','ADD COLUMN telefono VARCHAR(20)','Sin NOT NULL (admite NULL)']},
{id:'s7', lvl:2, tags:['ALTER'], title:'ALTER TABLE: añadir una clave ajena', q:'La tabla <code>parcela</code> ya tiene la columna dni_vecino pero no la clave ajena. Añádela hacia <code>vecino(dni_vecino)</code>.', sol:"ALTER TABLE parcela\n  ADD FOREIGN KEY (dni_vecino) REFERENCES vecino(dni_vecino);", hints:['ALTER TABLE ... ADD FOREIGN KEY (col) REFERENCES tabla(col).'], rub:['ALTER TABLE parcela ADD FOREIGN KEY','REFERENCES vecino(dni_vecino)']},
{id:'s8', lvl:2, tags:['reflexiva','existencia'], title:'Empleado con jefe (reflexiva con rol)', q:'Empleado: dni (CP), nombre y salario obligatorios. Un empleado puede tener un <b>jefe</b> (que es otro empleado); el director general no tiene jefe. Un jefe puede tener varios subordinados.', sol:"CREATE TABLE empleado (\n  dni       CHAR(9) PRIMARY KEY,\n  nombre    VARCHAR(80) NOT NULL,\n  salario   DECIMAL(8,2) NOT NULL,\n  dni_jefe  CHAR(9),\n  FOREIGN KEY (dni_jefe) REFERENCES empleado(dni)\n);",
 hints:['Reflexiva 1:N → una FK de la tabla a sí misma.','«El director no tiene jefe» → mínimo 0 → la FK admite NULL.'], rub:['FK dni_jefe → empleado(dni) (a la misma tabla)','dni_jefe SIN NOT NULL (mínimo 0)','Nombre de columna que expresa el rol (jefe)']},
{id:'s9', lvl:3, tags:['ternaria','3 tablas'], title:'Suministro (ternaria)', q:'Un proveedor suministra un producto a un almacén con un precio. Ya existen proveedor(id), producto(id) y almacen(id). Crea la tabla de la relación: el mismo proveedor puede suministrar el mismo producto a almacenes distintos y el precio es obligatorio.', sol:"CREATE TABLE suministro (\n  proveedor_id  INT NOT NULL,\n  producto_id   INT NOT NULL,\n  almacen_id    INT NOT NULL,\n  precio        DECIMAL(8,2) NOT NULL,\n  PRIMARY KEY (proveedor_id, producto_id, almacen_id),\n  FOREIGN KEY (proveedor_id) REFERENCES proveedor(id),\n  FOREIGN KEY (producto_id)  REFERENCES producto(id),\n  FOREIGN KEY (almacen_id)   REFERENCES almacen(id)\n);",
 hints:['Ternaria → tabla con las tres FKs.','Los tres máximos son N → la CP son las tres columnas.'], rub:['Tres FOREIGN KEY, una por entidad','PRIMARY KEY compuesta por las tres','precio NOT NULL (atributo de la relación)']},
{id:'s10', lvl:2, tags:['multivalorado'], title:'Teléfonos de un cliente (multivalorado)', q:'Un cliente (dni, nombre) puede tener varios teléfonos. Crea las tablas necesarias (cliente ya existe con dni CHAR(9)). El mismo teléfono no puede repetirse para el mismo cliente.', sol:"CREATE TABLE telefono_cliente (\n  dni       CHAR(9) NOT NULL,\n  telefono  VARCHAR(15) NOT NULL,\n  PRIMARY KEY (dni, telefono),\n  FOREIGN KEY (dni) REFERENCES cliente(dni)\n);", hints:['Atributo multivalorado → tabla aparte con la clave del dueño.'], rub:['Tabla aparte (singular)','PRIMARY KEY (dni, telefono)','FOREIGN KEY (dni) REFERENCES cliente(dni)']},
{id:'s11', lvl:2, tags:['2 tablas'], title:'Equipo y ciclista (clave de texto)', q:'Equipo: nomeq (texto de hasta 25, CP) y director (puede no constar). Ciclista: dorsal (número, CP), nombre obligatorio (30), edad opcional y el equipo al que pertenece (obligatorio).', sol:"CREATE TABLE equipo (\n  nomeq     VARCHAR(25) PRIMARY KEY,\n  director  VARCHAR(30)\n);\n\nCREATE TABLE ciclista (\n  dorsal  SMALLINT PRIMARY KEY,\n  nombre  VARCHAR(30) NOT NULL,\n  edad    SMALLINT,\n  nomeq   VARCHAR(25) NOT NULL,\n  FOREIGN KEY (nomeq) REFERENCES equipo(nomeq)\n);", hints:['La FK nomeq debe ser del mismo tipo que equipo.nomeq: VARCHAR(25).'], rub:['equipo antes que ciclista','nomeq VARCHAR(25) en las dos tablas (mismo tipo)','nomeq NOT NULL en ciclista','director y edad sin NOT NULL']}
];
</script>
<script>// BDA-QUEST · motor del juego (mismo método que SYS-QUEST: teoría con truco, rondas de 10,
// banco de fallos que se repite hasta acertar 2 veces seguidas, chuleta y progreso).
(() => {
'use strict';
const D = window.BQ;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const UNITS = D.UNITS, unitById = id => UNITS.find(u => u.id === id);
const caseById = id => D.CASES.find(c => c.id === id);
const KEY = 'bdaquest_v1';
const fresh = () => ({paper:{}, plan:{}, xp:0, streak:0, best:0, done:0, right:0, fails:{}, recent:[], unit:{}, exams:[]});
let save;
try { save = {...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch { save = fresh(); }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} hud(); }

// ---------- normalización y corrección de texto libre ----------
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.=_,()\s-]/g,' ').replace(/\s+/g,' ').trim();
function hasAlt(text, alt){
  const a = norm(alt).trim(); if(!a) return false;
  if(a.length <= 3 && /^[a-z0-9]+$/.test(a)) return new RegExp('(^|[^a-z0-9])'+a+'([^a-z0-9]|$)').test(text);
  return text.includes(a);
}
function groupsHit(text, groups){ const t = ' '+norm(text)+' '; return groups.map(g => g.some(alt => hasAlt(t, alt))); }
// BDA-QUEST · tareas nuevas con formato de examen. Se inserta dentro de app.js (marcador TASKS2).
// Tipos: ents · attrs · card (binaria, reflexiva con roles, ternaria) · assert (existencialidad)
//        ddlw (DDL desde cero) · dmlr (revisar errores) · dmlw (DML desde cero)
const T2 = {};
const SQLX = D.SQL;
const lcx = s => String(s).toLowerCase();
const fold2 = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const nice = s => String(s).replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = n => { const w = n.trim(); if (/ción$/i.test(w)) return w.replace(/ción$/i, 'ciones'); if (/[aeiouáéíóú]$/i.test(w)) return w + 's'; if (/z$/i.test(w)) return w.slice(0, -1) + 'ces'; return w + 'es'; };
T2.TYPES = new Set(['ents', 'attrs', 'card', 'assert', 'ddlw', 'dmlr', 'dmlw']);
T2.has = t => T2.TYPES.has(t);
T2.LABEL = {ents: 'ENTIDADES', attrs: 'ATRIBUTOS', card: '(MIN,MAX)', assert: 'EXISTENCIALIDAD', ddlw: 'DDL DESDE CERO', dmlr: 'REVISA EL ERROR', dmlw: 'DML DESDE CERO'};
T2.partOf = q => ({ents: 1, attrs: 1, card: 1, assert: 2, ddlw: 3, dmlr: 4, dmlw: 4})[q.type] || null;

// ---------- E/R de cada caso (los antiguos se deducen del marco) ----------
const sameName = (a, b) => fold2(a) === fold2(b);
function entityName(c, tname) {
  for (const r of c.rels) for (const n of [r.a, r.b, ...(r.ternary || []).map(x => x.e)]) if (n && sameName(n, tname)) return n;
  return nice(tname.toLowerCase());
}
function isJunction(t) { const p = t.cols.filter(x => /P/.test(x[1])); return p.length >= 2 && p.every(x => x[2]); }
T2.erOf = function (c) {
  if (c.er) return c.er;
  const ents = c.tables.filter(t => !isJunction(t)).map(t => ({n: entityName(c, t.name), attrs: t.cols.filter(x => !x[2]).map(x => [x[0], (/P/.test(x[1]) ? 'I' : '') + (/o/.test(x[1]) ? 'o' : '')])}));
  const traps = c.rels.filter(r => r.attr).map(r => ({n: sentence(r.verb), why: `«${sentence(r.verb)}» es una relación (un verbo): ${r.a} y ${r.b} son las entidades.`}));
  return (c.er = {entities: ents, traps});
};
const flagsOf = (a, f) => (a[1] || '').includes(f);

// ---------- preguntas nuevas de cada caso ----------
T2.extraCaseQs = function (c) {
  const out = [], er = T2.erOf(c);
  out.push({id: `ents:${c.id}`, topic: 'er', type: 'ents', title: `${c.name}: entidades`, cs: c, truco: 'Entidad = sustantivo con identificador, y SIEMPRE en singular. Verbos → relaciones, datos → atributos.'});
  for (let i = 0; i < er.entities.length; i += 2) out.push({id: `attrs:${c.id}:${i / 2}`, topic: 'er', type: 'attrs', title: `${c.name}: atributos de ${er.entities.slice(i, i + 2).map(e => e.n).join(' y ')}`, cs: c, ents: er.entities.slice(i, i + 2), truco: 'Para cada atributo: ¿identifica? (subrayado) ¿puede faltar? (opcional) ¿admite varios valores? (multivalorado).'});
  (c.decisions || []).forEach((d, i) => out.push({id: `dec:${c.id}:${i}`, topic: 'er', type: 'choice', title: `${c.name}: ${d.title}`, q: d.q, opts: d.opts, cs: c, truco: d.truco}));
  out.push({id: `assert:${c.id}`, topic: 'tab', type: 'assert', title: `${c.name}: restricciones de existencialidad`, cs: c, truco: 'Mínimo 1 en el lado "1" de una relación (todo X tiene al menos un Y) no sale de la FK: se escribe como ASERCIÓN  X[clave] ⊆ Y[fk].'});
  out.push({id: `ddlw:${c.id}`, topic: 'ddl', type: 'ddlw', title: `${c.name}: escribe el DDL desde cero`, cs: c, truco: 'Orden: primero las tablas a las que apuntan otras. Por tabla: columnas + NOT NULL/UNIQUE, PRIMARY KEY, FOREIGN KEY. Tablas en singular.'});
  return out;
};
T2.dmlQs = function () {
  return [...D.DMLR.map(t => ({id: `dmlr:${t.id}`, topic: 'dml', type: 'dmlr', title: `Revisa: ${t.title}`, t, truco: t.truco})),
          ...D.DMLW.map(t => ({id: `dmlw:${t.id}`, topic: 'dml', type: 'dmlw', title: t.title, t, truco: (t.hints || [])[0] || 'Lee el enunciado y construye la consulta cláusula a cláusula.'}))];
};

// ---------- motor de datos ----------
const baseEng = {};
T2.mkEngine = db => { if (!baseEng[db]) baseEng[db] = SQLX.Engine.fromScript(D.SEEDS[db]); return baseEng[db].clone(); };
function cell(v) { return v === null || v === undefined ? '<i class="nul">NULL</i>' : esc(SQLX.fmtVal(v)); }
function resultTable(res, max = 6, hi) {
  const rows = res.rows.slice(0, max);
  return `<div class="tblwrap"><table class="rt"><thead><tr>${res.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${res.cols.length}"><i class="nul">(0 filas)</i></td></tr>`}</tbody></table></div>${res.rows.length > max ? `<p class="small">… ${res.rows.length} filas en total (se muestran ${max}).</p>` : `<p class="small">${res.rows.length} fila(s).</p>`}`;
}
function dataViewer(db, only) {
  const e = T2.mkEngine(db); const names = only || D.DB_INFO[db].tables;
  const tabs = Object.values(e.tables).filter(t => !only || names.some(n => sameName(n, t.name)));
  return `<details class="rules"><summary>🗂 Tablas y datos de «${esc(D.DB_INFO[db].name)}» (toca para ver)</summary>${tabs.map(t => `<p class="small"><b>${esc(t.name)}</b>(${t.cols.map(c => `${t.pk.map(x => x.toLowerCase()).includes(c.name.toLowerCase()) ? '<u>' + esc(c.name) + '</u>' : esc(c.name)} <span class="ty">${esc(c.type)}${c.len ? '(' + c.len + (c.scale != null ? ',' + c.scale : '') + ')' : ''}${c.notNull ? ' NN' : ''}</span>`).join(', ')})${t.fks.length ? ' · FK: ' + t.fks.map(f => `${esc(f.cols.join(','))}→${esc(f.ref)}`).join('; ') : ''}</p>${resultTable({cols: t.cols.map(c => c.name), rows: t.rows.slice(0, 5).map(r => t.cols.map(c => r[c.name.toLowerCase()]))}, 5)}`).join('')}</details>`;
}

// ---------- ENTIDADES ----------
function entOptions(q) {
  const c = q.cs, er = T2.erOf(c), opts = [];
  er.entities.forEach(e => opts.push({t: e.n, ok: true, why: `${e.n} es una entidad: tiene identificador y varias propiedades. Y está en singular.`}));
  const ents = shuffle(er.entities);
  ents.slice(0, 2).forEach(e => opts.push({t: plural(e.n), ok: false, why: `Plural: las entidades se nombran en SINGULAR (${e.n}): el nombre es el del tipo, no el del conjunto.`}));
  shuffle(er.entities.flatMap(e => e.attrs.filter(a => !flagsOf(a, 'I') && !flagsOf(a, 'c')).map(a => [e, a]))).slice(0, 2).forEach(([e, a]) => opts.push({t: nice(a[0]), ok: false, why: `«${nice(a[0])}» es un ATRIBUTO de ${e.n}, no una entidad.`}));
  (er.traps || []).slice(0, 2).forEach(t => opts.push({t: t.n, ok: false, why: t.why}));
  const seen = new Set(); return shuffle(opts.filter(o => { const k = fold2(o.t); if (seen.has(k)) return false; seen.add(k); return true; }));
}
function renderEnts(q) {
  st.opts = entOptions(q); st.sel = new Set();
  return `${rulesBox(q.cs, true)}<p class="hint">Marca <b>solo las entidades</b> del enunciado (en <b>singular</b>). Las relaciones son verbos y los atributos son datos.</p><div class="opts">${st.opts.map((o, i) => `<button class="opt" data-i="${i}" onclick="BQA.tog(${i})">${esc(o.t)}</button>`).join('')}</div>`;
}
function checkEnts(q) {
  if (!st.sel.size) return {flash: 'Marca al menos una entidad.'};
  let good = 0, wrong = 0; const total = st.opts.filter(o => o.ok).length;
  document.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.i, o = st.opts[i], on = st.sel.has(i); b.disabled = true;
    if (o.ok && on) good++; if (!o.ok && on) wrong++;
    b.classList.add(o.ok ? (on ? 'good' : 'bad') : (on ? 'bad' : 'dim')); b.innerHTML = `${esc(o.t)}<small>${o.ok && !on ? 'Faltaba: ' : ''}${esc(o.why)}</small>`; });
  const score = Math.max(0, (good - wrong * .5) / total);
  return {ok: good === total && !wrong, score, fb: ''};
}

// ---------- ATRIBUTOS ----------
function renderAttrs(q) {
  const multi = q.ents.some(e => e.attrs.some(a => flagsOf(a, 'm'))), comp = q.ents.some(e => e.attrs.some(a => flagsOf(a, 'c')));
  st.attrCols = {multi, comp};
  return `${rulesBox(q.cs, true)}<p class="hint">Para cada atributo marca: <b>identificador</b> (el subrayado; solo uno por entidad), <b>opcional</b> (puede faltar)${multi ? ', <b>multivalorado</b> (varios valores)' : ''}${comp ? ' y <b>componente de un atributo compuesto</b>' : ''}.</p>
  ${q.ents.map((e, ei) => `<div class="tblwrap"><table class="keys attrs" data-e="${ei}"><thead><tr><th>${esc(e.n)}</th><th>Identificador</th><th>Opcional</th>${multi ? '<th>Multivalorado</th>' : ''}${comp ? '<th>Compuesto</th>' : ''}</tr></thead><tbody>${shuffle(e.attrs.map((a, ai) => ai)).map(ai => `<tr data-a="${ai}"><td><code>${esc(e.attrs[ai][0])}</code></td><td><input type="radio" name="id${ei}" class="aid"></td><td><input type="checkbox" class="aop"></td>${multi ? '<td><input type="checkbox" class="amu"></td>' : ''}${comp ? '<td><input type="checkbox" class="aco"></td>' : ''}</tr>`).join('')}</tbody></table></div>`).join('')}`;
}
function checkAttrs(q) {
  let total = 0, good = 0;
  document.querySelectorAll('table.attrs').forEach(tb => { const e = q.ents[+tb.dataset.e];
    tb.querySelectorAll('tbody tr').forEach(tr => { const a = e.attrs[+tr.dataset.a];
      const cks = [['.aid', flagsOf(a, 'I')], ['.aop', flagsOf(a, 'o')], ['.amu', flagsOf(a, 'm')], ['.aco', flagsOf(a, 'c')]];
      cks.forEach(([sel, exp]) => { const el = tr.querySelector(sel); if (!el) return; total++; const g = el.checked === exp; if (g) good++; el.parentNode.classList.add(g ? 'good' : 'bad'); el.disabled = true; }); }); });
  return {ok: good === total, score: good / total, fb: `<ul class="flist">${q.ents.map(e => `<li><b>${esc(e.n)}</b>: identificador <code>${esc(e.attrs.filter(a => flagsOf(a, 'I')).map(a => a[0]).join(', '))}</code>${e.attrs.some(a => flagsOf(a, 'o')) ? ' · opcional: <code>' + esc(e.attrs.filter(a => flagsOf(a, 'o')).map(a => a[0]).join(', ')) + '</code>' : ''}${e.attrs.some(a => flagsOf(a, 'm')) ? ' · multivalorado: <code>' + esc(e.attrs.filter(a => flagsOf(a, 'm')).map(a => a[0]).join(', ')) + '</code>' : ''}</li>`).join('')}</ul><p class="small">Lo no marcado como opcional es obligatorio (así lo dice el enunciado).</p>`};
}

// ---------- (MIN,MAX): binaria, reflexiva con roles y ternaria ----------
const selOf = (k, vals) => `<select id="${k}">${['<option value="">?</option>', ...vals.map(v => `<option>${v}</option>`)].join('')}</select>`;
function renderCard(q) {
  const r = q.rel, c = q.cs;
  if (r.ternary) {
    st.tern = true;
    return `${rulesBox(c, true)}<p class="hint">Relación <b>ternaria</b>: las tres entidades participan a la vez. Pon el (min,max) de <b>cada una</b> (cuántas veces participa una instancia de esa entidad).</p>
    <div class="erline">${r.ternary.map((x, i) => `<span class="ent">${esc(x.e)}</span><span class="pair">(${selOf('tmin' + i, ['0', '1'])},${selOf('tmax' + i, ['1', 'N'])})</span>`).join('<span class="line"></span>')}</div><div class="erline"><span class="rombo">${esc(r.verb)}</span></div>
    <p class="hint">Atributo propio de la relación: <input id="attr" placeholder="nombre del atributo"></p>`;
  }
  const refl = !!r.roles;

// ---------- EXISTENCIALIDAD (aserciones) ----------

// ---------- dibujo del E/R (solución) ----------
T2.erSvg = function (c) {
  const ents = [...new Set(c.rels.flatMap(r => r.ternary ? r.ternary.map(x => x.e) : [r.a, r.b]))];
  const W = 760, H = 460, cx = W / 2, cy = H / 2, rx = 290, ry = 165, pos = {};
  ents.forEach((e, i) => { const a = (i / ents.length) * Math.PI * 2 - Math.PI / 2; pos[e] = [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  let s = `<svg viewBox="0 0 ${W} ${H}" class="ersvg" role="img" aria-label="E/R de ${esc(c.name)}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const box = (x, y, t) => `<rect x="${x - 46}" y="${y - 15}" width="92" height="30" fill="#fff" stroke="#111" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#111">${esc(t)}</text>`;
  const rhomb = (x, y, t) => `<polygon points="${x},${y - 17} ${x + 46},${y} ${x},${y + 17} ${x - 46},${y}" fill="#fff" stroke="#111" stroke-width="2"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" fill="#111">${esc(t)}</text>`;
  const lab = (x1, y1, x2, y2, t) => { const px = x1 + (x2 - x1) * .3, py = y1 + (y2 - y1) * .3; return `<text x="${px}" y="${py - 5}" text-anchor="middle" font-size="12" font-weight="700" fill="#b33">${esc(t)}</text>`; };
  c.rels.forEach(r => {
    if (r.ternary) { const pts = r.ternary.map(x => pos[x.e]); const mx = pts.reduce((a, p) => a + p[0], 0) / 3, my = pts.reduce((a, p) => a + p[1], 0) / 3;
      r.ternary.forEach((x, i) => { s += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${mx}" y2="${my}" stroke="#111" stroke-width="1.5"/>${lab(pts[i][0], pts[i][1], mx, my, `(${x.m.join(',')})`)}`; }); s += rhomb(mx, my, r.verb); }
    else if (r.a === r.b) { const [x, y] = pos[r.a]; const mx = x + 70, my = y - 60; s += `<path d="M ${x + 30} ${y - 15} Q ${mx + 20} ${my - 20} ${mx} ${my + 17}" fill="none" stroke="#111" stroke-width="1.5"/><path d="M ${x + 46} ${y} Q ${mx + 70} ${my + 20} ${mx + 40} ${my + 12}" fill="none" stroke="#111" stroke-width="1.5"/>${rhomb(mx, my, r.verb)}<text x="${x + 26}" y="${y - 24}" font-size="11" font-weight="700" fill="#b33">(${r.na.join(',')}) ${esc(r.roles.a)}</text><text x="${x + 52}" y="${y + 18}" font-size="11" font-weight="700" fill="#b33">(${r.nb.join(',')}) ${esc(r.roles.b)}</text>`; }
    else { const [x1, y1] = pos[r.a], [x2, y2] = pos[r.b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="1.5"/>${lab(x1, y1, x2, y2, `(${r.na.join(',')})`)}${lab(x2, y2, x1, y1, `(${r.nb.join(',')})`)}${rhomb(mx, my, r.verb)}`; }
  });
  ents.forEach(e => { s += box(pos[e][0], pos[e][1], e); });

// ---------- dibujo del E/R COMPLETO (con atributos), como en el examen ----------

  const add = (target, html) => { const id = 'g' + (++uid); (target.errs = target.errs || []).push(id); errors.push({id, model: html}); };
  const kinds = ['dropNN', 'addNN', 'dropUQ', 'dropFK', 'wrongFK', 'shortPk', 'noPk', 'plural', 'order', 'dupPk', 'dropNN', 'dropFK'];
  for (let tries = 0; tries < 60 && errors.length < k; tries++) {
    const kind = pick1(kinds), t = pick1(model), key = t.name;
    if (kind === 'dropNN') { const cs = t.cols.filter(c => c.nn && !c.dropNN && !t.pk.includes(c.n) && !used.has(key + c.n)); if (!cs.length) continue; const c = pick1(cs); used.add(key + c.n); c.dropNN = true; add(c, c.isFk ? `<code>${t.name}.${c.n}</code> es una FK <b>obligatoria</b> (mínimo 1: siempre tiene su ${lcs(t.fks.find(f => f.cols.includes(c.n)).ref)}): falta <b>NOT NULL</b> (restricción de existencia).` : `<code>${t.name}.${c.n}</code> es <b>obligatorio</b> (el enunciado no dice que pueda faltar): falta <b>NOT NULL</b>.`); }
    else if (kind === 'addNN') { const cs = t.cols.filter(c => c.opt && !c.addNN && !used.has(key + c.n)); if (!cs.length) continue; const c = pick1(cs); used.add(key + c.n); c.addNN = true; add(c, c.isFk ? `<code>${t.name}.${c.n}</code> es una FK <b>opcional</b> (mínimo 0: puede no tener ${lcs(t.fks.find(f => f.cols.includes(c.n)).ref)}): debe admitir NULL, sobra el NOT NULL.` : `<code>${t.name}.${c.n}</code> es <b>opcional</b> (puede no tener valor): sobra el NOT NULL.`); }
    else if (kind === 'dropUQ') { const cs = t.cols.filter(c => c.uq && !c.dropUQ && !used.has(key + c.n)); if (!cs.length) continue; const c = pick1(cs); used.add(key + c.n); c.dropUQ = true; add(c, `<code>${t.name}.${c.n}</code> es clave alternativa (no puede repetirse): falta <b>UNIQUE</b>.`); }
    else if (kind === 'dropFK') { const fs = t.fks.filter(f => !f.dropped && !f.wrong && !used.has(key + f.cols[0])); if (!fs.length) continue; const f = pick1(fs); used.add(key + f.cols[0]); f.dropped = true; const last = t.cols.find(c => c.n === f.cols[f.cols.length - 1]); add(last, `<b>Falta la FOREIGN KEY</b> <code>FOREIGN KEY (${f.cols.join(', ')}) REFERENCES ${lcs(f.ref)}(${f.refCols.join(', ')})</code> en ${t.name}.`); }
    else if (kind === 'wrongFK') { const fs = t.fks.filter(f => !f.dropped && !f.wrong && f.cols.length === 1 && !used.has(key + f.cols[0])); if (!fs.length) continue; const f = pick1(fs); const others = model.filter(x => x.name !== f.ref && x.name !== t.name && x.pk.length === 1); if (!others.length) continue; const o = pick1(others); used.add(key + f.cols[0]); f.wrong = o.name; f.wrongCols = o.pk.slice(0, 1); add(f, `La FK de <code>${t.name}.${f.cols[0]}</code> apunta a <b>la tabla equivocada</b> (<code>${lcs(o.name)}</code>): debe ser <code>REFERENCES ${lcs(f.ref)}(${f.refCols.join(', ')})</code>.`); }
    else if (kind === 'shortPk') { if (t.pk.length < 2 || t.shortPk || t.noPk || used.has('pk' + key)) continue; used.add('pk' + key); t.shortPk = true; add({get errs() { return t.errPk; }, set errs(v) { t.errPk = v; }}, `La CP de <code>${t.name}</code> debe ser <b>compuesta</b> <code>(${t.pk.join(', ')})</code>. Con solo <code>${t.pk[0]}</code> la tabla admitiría una única fila por ${t.pk[0]}.`); }
    else if (kind === 'noPk') { if (t.noPk || t.shortPk || t.dupPk || used.has('pk' + key)) continue; used.add('pk' + key); t.noPk = true; add({get errs() { return t.errCreate; }, set errs(v) { t.errCreate = v; }}, `<b>${t.name} no tiene clave primaria</b>: debe ser <code>PRIMARY KEY (${t.pk.join(', ')})</code>.`); }
    else if (kind === 'plural') { if (t.plural || used.has('n' + key)) continue; used.add('n' + key); t.plural = true; add({get errs() { return t.errCreate; }, set errs(v) { t.errCreate = v; }}, `<b>Nombre en plural</b>: las tablas se nombran en <b>singular</b> (<code>${lcs(t.name)}</code>, no <code>${pluralOf(t.name)}</code>).`); }
    else if (kind === 'dupPk') { if (t.pk.length !== 1 || t.dupPk || t.noPk || used.has('pk' + key)) continue; used.add('pk' + key); t.dupPk = true; add({get errs() { return t.errPk; }, set errs(v) { t.errPk = v; }}, `<b>PRIMARY KEY dos veces</b> sobre <code>${t.pk[0]}</code> en ${t.name}: ya la lleva en su línea; una tabla tiene una sola clave primaria.`); }
    else if (kind === 'order') { const i = model.indexOf(t), f = t.fks.find(f => !f.dropped && !f.wrong && f.ref !== t.name && model.indexOf(model.find(x => x.name === f.ref)) < i && !used.has('o' + key)); if (!f) continue; const ri = model.indexOf(model.find(x => x.name === f.ref)); used.add('o' + key); model.splice(i + 1, 0, model.splice(ri, 1)[0]); add(f, `<b>Orden de creación</b>: <code>${lcs(t.name)}</code> tiene una FK hacia <code>${lcs(f.ref)}</code>, que se crea <b>después</b>. Hay que crear antes la tabla referenciada.`); }
  }
  return errors;
}

// ---------- chuletas ----------
const CHULETA = {
  dml: '<ol class="plist"><li>Orden: <code>SELECT · FROM · WHERE · GROUP BY · HAVING · ORDER BY · LIMIT</code>.</li><li>Una fila / unas filas concretas: <code>WHERE clave = valor</code>. UPDATE y DELETE <b>siempre</b> con WHERE.</li><li>NULL: <code>IS NULL</code> / <code>IS NOT NULL</code> (nunca = NULL).</li><li>Texto y fechas entre comillas simples; fechas <code>\'AAAA-MM-DD\'</code>.</li><li>LIKE: <code>%</code> = cualquier texto, <code>_</code> = una letra. BETWEEN incluye los extremos.</li><li>AND/OR mezclados → paréntesis. Varias columnas en SET → comas.</li><li>Agregados: COUNT, SUM, AVG, MIN, MAX. Columna normal + agregado → GROUP BY. Filtrar filas → WHERE; filtrar grupos → HAVING.</li><li>Los N mayores: <code>ORDER BY col DESC LIMIT N</code>. Sin repetir: DISTINCT.</li><li>Funciones: CONCAT, UPPER, LOWER, CHAR_LENGTH, SUBSTRING, ROUND, YEAR, MONTH, DAYNAME, CASE WHEN.</li><li>INSERT: <code>INSERT INTO t (cols) VALUES (...)</code>, valores en el orden de las columnas.</li><li>Borrar un padre con hijos: primero los hijos.</li><li><b>Agregado + columna</b> en el mismo SELECT sin GROUP BY: no se puede (<code>SELECT dorsal, MIN(edad)</code>). Datos de la fila del mínimo/máximo → <b>subconsulta</b>: <code>WHERE edad = (SELECT MIN(edad) FROM ciclista)</code>.</li><li>Filtrar <b>antes</b> de agrupar → WHERE; filtrar el resultado de un grupo → HAVING. Orden: WHERE → GROUP BY → HAVING.</li><li>Funciones anidadas: se resuelven de dentro hacia fuera: <code>ROUND(AVG(edad), 1)</code>, <code>UPPER(SUBSTRING(nombre, 1, 3))</code>.</li><li>El alias (<code>AS nombre</code>) <b>no es obligatorio</b>.</li></ol>',
  ddl: '<ol class="plist"><li>Una tabla por entidad (<b>singular</b>) y una intermedia por cada N:M / ternaria / multivalorado.</li><li>Crea primero las tablas a las que apuntan otras (orden).</li><li>Por tabla: columnas con tipo → <code>NOT NULL</code> si es obligatorio → <code>PRIMARY KEY</code> (compuesta una sola vez) → <code>UNIQUE</code> en alternativas → <code>FOREIGN KEY (x) REFERENCES T(pk)</code>.</li><li>Si el enunciado da un identificador natural (DNI, matrícula, ISBN...) esa es la CP; solo hay <code>id</code> si el enunciado lo da o no hay ninguna clave.</li><li>FK obligatoria (mínimo 1) → NOT NULL; opcional (mínimo 0) → sin NOT NULL. La FK y la columna referenciada, del mismo tipo.</li><li>Tipos: INT, VARCHAR(n), CHAR(n), DATE, DATETIME, DECIMAL(8,2), ENUM(\'a\',\'b\').</li><li>Sin consultas en el DDL.</li></ol>',
  er: '<ol class="plist"><li>Entidades = sustantivos con identificador, en <b>singular</b>. Verbos = relaciones. Datos = atributos.</li><li>Por atributo: identificador (subrayado), opcional, multivalorado (doble óvalo), compuesto, derivado.</li><li>Par (min,max) <b>pegado a la entidad que se cuenta</b>: Cliente (1,1) — realiza — (0,N) Pedido = cada pedido, exactamente 1 cliente; un cliente, 0 a N pedidos. Escribe la frase.</li><li>«Puede / ninguno» → 0 · «siempre / exactamente / al menos uno / todo» → 1 · «varios» → N.</li><li>Reflexiva: mismo nombre en las dos puntas + rol en cada una. Ternaria: tres pares y atributos colgando del rombo.</li><li>Si la misma pareja se repite en fechas distintas, la relación pasa a ser una entidad.</li><li>Entidad débil: no se identifica sola (doble rectángulo, rombo doble, clave parcial). ISA: parcial/total, disyunta/solapada.</li></ol>',
  tab: '<ol class="plist"><li>Una tabla por entidad, por N:M, por ternaria y por atributo multivalorado. Nombres en singular y mayúsculas.</li><li>1:N → FK en la tabla del lado N. N:M → intermedia con las dos FKs y CP compuesta (atributos de la relación ahí).</li><li>Mínimo 1 → VNN en la FK · mínimo 0 → admite NULL. 1:1 → FK + C.Alt (UNIQUE).</li><li>Reflexiva 1:N → FK a la propia tabla. Ternaria → 3 FKs y CP de las tres. Débil → CP = clave del fuerte + parcial.</li><li><b>Existencialidad</b>: mínimo 1 en la entidad del lado "1" → ASERCIÓN <code>PADRE[clave] ⊆ HIJA[fk]</code>. ISA total → <code>SUP ⊆ SUB1 ∪ SUB2</code>; disyunta → <code>SUB1 ∩ SUB2 = ∅</code>.</li><li>Por tabla: CP · C.Alt · C.Aj · VNN.</li></ol>',
  norm: '<ol class="plist"><li>1FN: sin grupos repetidos {} ni valores compuestos → sácalos a otra tabla con la clave del padre.</li><li>2FN: ningún atributo depende de solo una parte de la clave compuesta.</li><li>3FN: ningún atributo depende de otro no clave (transitiva).</li><li>FNBC: todo determinante es clave candidata.</li></ol>'};
const chuletaFor = id => { const k = id.split(':')[0]; return k.startsWith('dml') ? CHULETA.dml : k.startsWith('ddl') ? CHULETA.ddl : (k === 'er' || k === 'card0' || k === 'card1') ? CHULETA.er : (k === 'tab' || k === 'tab0') ? CHULETA.tab : k === 'norm' ? CHULETA.norm : ''; };

// ---------- niveles y minutos ----------
function dmlLevel(t) { if (t.lvl) return t.lvl; const r = [].concat(t.ref || t.bad).join(' '); return /HAVING|CASE|TIMESTAMPDIFF|;\s*\w|ROUND\(.*AVG/i.test(r) || [].concat(t.ref || []).length > 1 ? 3 : /GROUP BY|BETWEEN|LIKE|IN \(|DISTINCT|LIMIT|CONCAT|YEAR|MONTH|SUBSTRING|UPDATE|DELETE|INSERT/i.test(r) ? 2 : 1; }
function paperMeta(id) {
  const k = id.split(':')[0], rest = id.split(':').slice(1).join(':');
  if (k === 'er' || k === 'tab') { const c = caseAny(rest), n = T2.erOf(c).entities.length; return {title: `${k === 'er' ? 'E/R' : 'Tablas'} · ${c.name}`, level: c.level || 2, min: k === 'er' ? 3 + 2 * n : 2 + 2 * c.tables.length}; }
  if (k === 'ddlv') { const c = caseAny(rest); return {title: `DDL validar · ${c.name}`, level: c.level || 2, min: 7}; }
  if (k === 'ddlg') { const c = caseAny(rest); return {title: `DDL con errores (generado) · ${c.name}`, level: c.level || 2, min: 6}; }
  if (k === 'ddlw' || k === 'ddlh') { const c = caseAny(rest), n = ddlNames(c).length; return {title: `DDL desde el E/R · ${c.name}`, level: c.level || 2, min: 3 + 2 * n}; }
  if (k === 'dmlr') { const t = D.DMLR.find(x => x.id === rest); return {title: `DML revisar · ${t.title}`, level: dmlLevel(t), min: 3}; }
  if (k === 'dmlw') { const t = D.DMLW.find(x => x.id === rest), l = dmlLevel(t); return {title: `DML desde cero · ${t.title}`, level: l, min: l === 1 ? 2 : l === 2 ? 4 : 6}; }
  if (k === 'ddls') { const t = D.DDLS.find(x => x.id === rest); return {title: `DDL ${t.title}`, level: t.lvl, min: 3 + t.lvl * 2}; }
  if (k === 'norm') { const t = D.NORM.find(x => x.id === rest); return {title: `Normalización · ${t.title}`, level: /6[a-f]/.test(t.id) ? 1 : 3, min: /6[a-f]/.test(t.id) ? 3 : 8}; }
  if (k === 'card0') return {title: 'Cardinalidades (boletín 0)', level: 1, min: 8};
  if (k === 'card1') return {title: `Relámpago pares · ${+rest + 1}`, level: 1, min: 2};
  if (k === 'tab0') return {title: `Relámpago tablas · ${+rest + 1}`, level: 1, min: 3};
  return {title: id, level: 2, min: 5};
}

// ---------- construcción de cada ejercicio ----------
function paperItem(id) {
  const k = id.split(':')[0], rest = id.split(':').slice(1).join(':'); let it;
  if (k === 'er') it = itemER(caseAny(rest)); else if (k === 'tab') it = itemTab(caseAny(rest)); else if (k === 'ddlv') it = itemDdlV(caseAny(rest)); else if (k === 'ddlg') it = itemDdlG(caseAny(rest));
  else if (k === 'ddlw' || k === 'ddlh') it = itemDdlW(caseAny(rest));
  else if (k === 'dmlr') it = itemDmlR(D.DMLR.find(t => t.id === rest)); else if (k === 'dmlw') it = itemDmlW(D.DMLW.find(t => t.id === rest));
  else if (k === 'ddls') it = itemDdls(D.DDLS.find(t => t.id === rest)); else if (k === 'norm') it = itemNorm(D.NORM.find(t => t.id === rest)); else if (k === 'card0') it = itemCard0(); else if (k === 'card1') it = itemCard1(+rest); else if (k === 'tab0') it = itemTab0(+rest);
  const m = paperMeta(id); it.level = m.level; it.min = m.min; it.chuleta = chuletaFor(id); return it;
}
function itemER(c) {
  const er = T2.erOf(c), hints = [
    `Subraya en el enunciado los sustantivos con identificador: serán entidades. Hay ${er.entities.length}. Todas en singular.`,
    `Las entidades empiezan por: ${er.entities.map(e => esc(e.n[0]) + '…').join(', ')}.`,
    `Busca los verbos: hay ${c.rels.length} relaciones${c.rels.some(r => r.roles) ? ' (alguna es reflexiva: pon un rol en cada punta)' : ''}${c.rels.some(r => r.ternary) ? ' (una es ternaria: tres pares)' : ''}.`,
    'Cada par: «puede / ninguno» → 0 · «siempre / exactamente / al menos uno / todo» → 1 · «varios / muchos» → N. Pon el par pegado a la entidad que se cuenta y escribe la frase al lado.',
    `Atributos: subraya el identificador${er.entities.some(e => e.attrs.some(a => /o/.test(a[1]))) ? ', marca los opcionales' : ''}${er.entities.some(e => e.attrs.some(a => /m/.test(a[1]))) ? ', dobla el óvalo de los multivalorados' : ''}. Lo que no se dice que es opcional es obligatorio.`];
  const rub = [`Entidades en <b>singular</b>: ${er.entities.map(e => esc(e.n)).join(', ')}`,
    ...er.entities.map(e => `Identificador de <b>${esc(e.n)}</b>: ${esc(e.attrs.filter(a => /I|p/.test(a[1])).map(a => a[0]).join(' + ') || '(subtipo: hereda el del supertipo)')}${e.attrs.some(a => /o/.test(a[1])) ? ' · opcionales: ' + esc(e.attrs.filter(a => /o/.test(a[1])).map(a => a[0]).join(', ')) : ''}${e.attrs.some(a => /m/.test(a[1])) ? ' · multivalorados: ' + esc(e.attrs.filter(a => /m/.test(a[1])).map(a => a[0]).join(', ')) : ''}`),
    ...c.rels.map(relText), ...(c.decisions || []).map(d => `${esc(d.title)}: ${esc(d.opts.find(o => o[1])[0])}`), ...(c.extra || []).map(strip).map(esc)];
  const sol = `<h4>Entidades y atributos</h4><ul class="plist">${er.entities.map(e => `<li>${entText(e)}</li>`).join('')}</ul><h4>Relaciones (par pegado a la entidad que se cuenta)</h4><ul class="plist">${c.rels.map(r => `<li>${relText(r)}<br><span class="small">${esc(r.why || '')}</span></li>`).join('')}</ul>${(c.decisions || []).length ? `<h4>Decisiones de modelado</h4><ul class="plist">${c.decisions.map(d => `<li><b>${esc(d.title)}:</b> ${esc(d.opts.find(o => o[1])[0])}<br><span class="small">${esc(d.opts.find(o => o[1])[2])}</span></li>`).join('')}</ul>` : ''}${(c.extra || []).length ? `<h4>Detalles</h4><ul class="plist">${c.extra.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}${(er.traps || []).length ? `<p class="small">No son entidades: ${er.traps.map(t => esc(t.n)).join(', ')}.</p>` : ''}<h4>Dibujo</h4>${c.img ? `<img src="${c.img}" alt="E/R" style="max-width:100%;background:#fff">` : T2.erSvg(c)}<p class="small">Dibujo simplificado (sin atributos ni ISA/débiles): compara entidades y pares.</p>`;
  return {id: 'er:' + c.id, part: 1, title: `E/R · ${c.name}`, src: c.from, statement: `${rulesList(c)}<p>Dibuja el E/R: entidades (singular), atributos (identificador subrayado, opcionales, multivalorados), relaciones con su (min,max), roles en las reflexivas y atributos de las relaciones.</p>`, hints, solution: sol, rubric: rub};
}
function itemTab(c) {

    `Pasan a tabla las entidades (${er.entities.length}) más una tabla por cada N:M${hasTern ? ' y por la ternaria' : ''}${er.entities.some(e => e.attrs.some(a => /m/.test(a[1]))) ? ' y por cada atributo multivalorado' : ''}. Total: ${tables.length} tablas. Nombres en singular y mayúsculas.`,
    'En cada 1:N la FK va en la tabla del lado N. En cada N:M, tabla intermedia con las dos FKs y CP compuesta (los atributos de la relación van ahí).',

  const sol = `<pre class="code">${esc(tables.map(t => marcoText(t, tables)).join('\n\n'))}${(c.asserts || []).length ? '\n\n' + esc(c.asserts.map((a, i) => `ASERCIÓN ${i + 1}: ${a.t}`).join('\n')) : ''}</pre>${tables.filter(t => t.note).map(t => `<p class="small"><b>${esc(t.name)}:</b> ${esc(t.note)}</p>`).join('')}${(c.asserts || []).map(a => `<p class="small">${esc(a.why)}</p>`).join('')}`;
  return {id: 'tab:' + c.id, part: 2, title: `Paso a tablas · ${c.name}`, src: c.from, statement: `${fig}<h4>Atributos</h4><ul class="plist">${er.entities.map(e => `<li>${entText(e)}</li>`).join('')}</ul><h4>Relaciones (par pegado a la entidad que se cuenta)</h4><ul class="plist">${c.rels.map(r => `<li>${relText(r)}</li>`).join('')}</ul>${(c.extra || []).length ? `<ul class="plist small">${c.extra.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}<p>Haz el paso a tablas con la notación de marco: CP, C.Alt, C.Aj, VNN y las restricciones de existencialidad (aserciones) que exija el diagrama.</p>`, hints, solution: sol, rubric: rub};
}
function itemDdlV(c) {
  const lines = parseDDL(c.ddl), ids = Object.keys(c.errors);
  const num = lines.map((l, i) => `${String(i + 1).padStart(2)}  ${l.text}`).join('\n');
  const prim = e => lines.findIndex(l => l.errs.includes(e)) + 1;
  const hints = [`Hay ${ids.length} errores respecto al enunciado.`, 'Recorre tabla a tabla: ¿PK? ¿FKs (y a qué tabla/columna)? ¿NOT NULL donde toca y solo donde toca? ¿UNIQUE? ¿orden de creación? ¿nombres en singular?', `Errores en las líneas: ${ids.map(prim).sort((a, b) => a - b).join(', ')}.`, 'En el porqué, cita la regla del enunciado (R1, R2...) y di cómo quedaría bien.'];
  return {id: 'ddlv:' + c.id, part: 3, title: `DDL: validar · ${c.name}`, src: c.from, statement: `${diagram(c)}${textoPlegado(c)}<p>Este DDL pretende ser el paso a tablas del E/R. Marca las líneas con error y explica por qué (campo libre). Si falta algo, indica dónde debería ir.</p><pre class="code">${esc(num)}</pre>`, hints,
    solution: `<ol class="plist">${ids.map(e => `<li><b>Línea ${prim(e)}:</b> ${c.errors[e].model}</li>`).join('')}</ol>`, rubric: ids.map(e => `Línea ${prim(e)} encontrada y explicada: ${esc(strip(c.errors[e].model).slice(0, 110))}…`)};
}
function itemDdlG(c) {
