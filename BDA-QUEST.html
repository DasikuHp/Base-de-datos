<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11102b">
<title>BDA-QUEST · Bases de Datos</title>
<style>
:root{--ink:#100e29;--panel:#24204b;--panel2:#30285e;--line:#8068d7;--cyan:#5de8ed;--pink:#ee77cb;--gold:#ffd36e;--green:#64e3a2;--red:#ff7187;--text:#f2eeff;--muted:#bdb6e1;--shadow:0 4px 0 #09081b,0 8px 20px #0008}
*{box-sizing:border-box}html,body{margin:0}
body{background:#0b0c22;color:var(--text);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(circle at 15% 10%,#32235a 0,transparent 30%),radial-gradient(circle at 90% 80%,#152b54 0,transparent 35%),linear-gradient(135deg,#090b20,#171135 58%,#101c3d);background-attachment:fixed;min-height:100vh}
code,pre,.mono,select,textarea,input{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace}
button,select,textarea,input{font-size:16px;color:var(--text)}
button{cursor:pointer;background:#282451;border:2px solid #9886eb;padding:9px 13px;box-shadow:0 4px 0 #0b0920,inset 0 0 0 2px #423779;transition:filter .12s,transform .12s;border-radius:2px;font-family:inherit}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0920}button:disabled{cursor:default}
.primary{background:#ad6931;border-color:#ffe39a;color:#1f1731;font-weight:700;box-shadow:0 4px 0 #5e2f25,inset 0 0 0 2px #e5a74c}
.ghost{background:#181a3b;border-color:#6259ac}.danger{background:#792c54;border-color:#ff8ea7}
.hidden{display:none!important}.small{font-size:14px;color:var(--muted)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px solid #7664c5;background:linear-gradient(180deg,#292355,#171738);box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;box-shadow:none;padding:0}
.chip{width:36px;height:36px;border:3px solid var(--cyan);background:linear-gradient(135deg,#5d3ea4,#201b55);display:grid;place-items:center;color:var(--gold);font-size:20px;box-shadow:0 0 12px #4de9ee55}
.brand{font:700 15px/1.1 ui-monospace,Consolas,monospace;letter-spacing:1px;text-shadow:2px 2px #7848b9}.brand small{display:block;font-weight:400;color:var(--muted);letter-spacing:0;text-shadow:none}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{border:2px solid #514a91;background:#131632;padding:3px 8px;color:var(--gold);font-size:15px;text-align:center;min-width:58px}.stat small{display:block;color:#aaa6d0;font-size:11px;line-height:1}
#failBtn{padding:3px 8px;font-size:15px}#failBtn.glow{border-color:var(--pink);box-shadow:0 0 10px #ee77cb88}
main{max-width:980px;margin:auto;padding:14px 16px 60px;outline:none}
.hero,.qcard,.block{background:linear-gradient(180deg,#24204bee,#1a1840ee);border:3px solid #8068d7;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.hero h1{margin:0 0 6px;font:700 26px ui-monospace,Consolas,monospace;color:var(--gold);text-shadow:3px 3px #5a2f8f}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row.big button{padding:12px 16px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec{font:700 18px ui-monospace,Consolas,monospace;color:var(--cyan);margin:22px 0 4px;letter-spacing:1px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ucard{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"i n p" "i s s" "i b b";text-align:left;gap:2px 10px;padding:12px}
.ucard.exam{border-color:var(--gold)}.uicon{grid-area:i;font-size:30px;color:var(--cyan);align-self:center}.uname{grid-area:n;font-weight:700}.usub{grid-area:s;font-size:13px;color:var(--muted)}
.ubadge{grid-area:b;font-size:11px;letter-spacing:1px;color:var(--gold)}.ucard:not(.exam) .ubadge{color:var(--muted)}.upct{grid-area:p;color:var(--green);font-size:14px}
.cases{display:grid;gap:8px}.case{background:#1b1940;border:2px solid #514a91;padding:10px 12px}.case .small{display:block}.case .row{margin:6px 0 0}.case .row button{padding:6px 10px;font-size:15px}
.hist{margin:6px 0 0;padding-left:18px}
.block h3{margin:0 0 8px;color:var(--gold)}.block img{display:block;max-width:100%;height:auto;background:#fff;border:2px solid #514a91;margin:6px 0 10px;border-radius:2px}
.block pre,.code{background:#0d0c24;border:2px solid #3f3a7a;padding:10px;overflow:auto;font-size:14px;line-height:1.35;white-space:pre}
.bx code,.q code,.feedback code,li code{background:#0d0c24;padding:1px 4px;border:1px solid #3f3a7a;font-size:.92em}
.truco{margin-top:10px;background:#2b2140;border-left:5px solid var(--gold);padding:8px 10px;font-size:15px}
.warn{border-color:var(--pink)}
.qhead{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;letter-spacing:1px;font-weight:700;color:#d9d1ff;background:#39336d;border:2px solid #7768c6;padding:3px 7px;display:inline-block}.ghosttag{background:none}
.qcard h2{margin:10px 0 6px;font-size:20px}.q{font-size:18px;margin:6px 0 10px}.hint{color:var(--muted);font-size:15px}
.opts{display:grid;gap:8px}.opt{text-align:left;padding:11px 13px;line-height:1.3}.opt.on{border-color:var(--cyan);background:#1d3b58}
.opt small{display:block;margin-top:4px;font-size:14px;color:#e8e4ff;opacity:.9}.opt.good{background:#17684f;border-color:#79efbb}.opt.bad{background:#792c54;border-color:#ff8ea7}.opt.dim{opacity:.55}
.match{display:grid;gap:8px}.match label{display:grid;grid-template-columns:1fr minmax(150px,1fr);gap:8px;align-items:center;background:#1b1940;border:2px solid #3f3a7a;padding:8px}
.match select{width:100%;background:#0d0c24;border:2px solid #6259ac;padding:6px}.match small{grid-column:1/-1;color:#ffd0da}
.match label.good{border-color:#79efbb}.match label.bad{border-color:#ff8ea7}
.order{padding-left:0;list-style:none;display:grid;gap:6px}.order li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#1b1940;border:2px solid #3f3a7a;padding:8px}
.order li.good{border-color:#79efbb}.order li.bad{border-color:#ff8ea7;flex-wrap:wrap}.order li small{width:100%;color:#ffd0da}.ob{display:flex;gap:4px}.ob button{padding:4px 9px}
textarea,input{width:100%;background:#0d0c24;border:2px solid #6259ac;padding:8px;line-height:1.35}input{width:auto;min-width:180px;padding:5px 8px}
select{background:#0d0c24;border:2px solid #6259ac;padding:4px}
.good{outline:none}select.good,input.good{border-color:#79efbb;background:#103b30}select.bad,input.bad{border-color:#ff8ea7;background:#4a1830}
.rules{background:#151433;border:2px dashed #6259ac;padding:8px 12px;margin:8px 0}.rules summary{cursor:pointer;color:var(--cyan);font-weight:700}.rules ol{margin:8px 0 0;padding-left:20px}.rules li{margin:4px 0;font-size:15px}
.erline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0;font-family:ui-monospace,Consolas,monospace}
.ent{border:3px solid var(--text);padding:8px 12px;font-weight:700;background:#1b1940}.rombo{border:2px solid var(--gold);padding:6px 12px;transform:skewX(-12deg);color:var(--gold)}
.line{flex:0 0 22px;height:2px;background:var(--text)}.pair{white-space:nowrap}
.tblwrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:2px solid #3f3a7a;padding:6px 8px;text-align:center}th{background:#30285e;font-size:14px}td:first-child{text-align:left}
.keys input[type=checkbox]{width:22px;height:22px;min-width:0;accent-color:#5de8ed}.keys td.good{background:#103b30}.keys td.bad{background:#4a1830}.keys td.na{opacity:.35}.keys td small{display:block;color:#ffd0da}
.ddl{background:#0d0c24;border:2px solid #3f3a7a;padding:6px 0;overflow-x:auto}
.dl .ln{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;box-shadow:none;padding:1px 10px;transform:none!important;filter:none!important;white-space:pre;color:var(--text)}
.dl .ln:hover:not(:disabled){background:#1d1b44}.dl .num{color:#6f68a8;min-width:22px;text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:14px}.dl code{font-size:14px;background:none;border:0}
.dl.on .ln{background:#3a2a10;outline:2px solid var(--gold)}.dl .why{padding:4px 10px 8px 42px}
.dl.found .ln{background:#103b30}.dl.missed .ln{background:#4a1830;outline:2px dashed #ff8ea7}.dl.falso .ln{background:#3a2440;text-decoration:line-through}
.feedback{margin-top:12px;border:3px solid;padding:10px 12px}.feedback.ok{border-color:#79efbb;background:#0f3329}.feedback.ko{border-color:#ff8ea7;background:#33142a}.feedback h3{margin:0 0 6px}
.errs{padding-left:18px}.errs li{margin:6px 0;padding:6px 8px;border-left:4px solid}.errs li.good{border-color:#79efbb}.errs li.half{border-color:var(--gold)}.errs li.bad{border-color:#ff8ea7}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}.part{position:relative;background:#1b1940;border:2px solid #514a91;padding:10px;display:grid;overflow:hidden}.part strong{font-size:26px;color:var(--gold)}.part i{position:absolute;left:0;bottom:0;height:5px;background:var(--green)}
.bar{display:inline-block;width:90px;height:10px;background:#131632;border:1px solid #514a91;margin-right:6px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--green)}
.flist li{margin:6px 0}.cheat li{margin:5px 0}
.opt.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}
.rolin{width:100px;min-width:0;margin:0 2px;font-size:14px;padding:4px 6px}
.editor{min-height:120px;font-size:15px;resize:vertical;margin:6px 0}
.keys input[type=radio]{width:20px;height:20px;min-width:0;accent-color:#5de8ed}
table.rt{font-size:14px}table.rt th,table.rt td{padding:3px 7px;text-align:left}.nul{color:#8f89c4}.ty{color:#8f89c4;font-size:12px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:8px 0}.dres{background:#14122f;border:2px solid #3f3a7a;padding:8px 10px;overflow-x:auto}.dres.bad{border-color:#ff8ea7;background:#33142a}
.ersvg{width:100%;height:auto;background:#fff;border:2px solid #514a91;margin:6px 0}
.errs.mini{margin:2px 0 6px;padding-left:14px}.errs.mini li{margin:3px 0;padding:2px 6px}.errs li small{color:#ffd0da}
label.small{display:block;margin:8px 0 2px}
.stepnow{display:flex;gap:12px;align-items:center;background:#1b1940;border:3px solid var(--gold);padding:12px;margin:8px 0;font-size:18px}.stepnow .uicon{font-size:36px}
.plan{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}.plan li button{width:100%;text-align:left;font-size:15px}.plan li.dn button{opacity:.55;border-color:#79efbb}.plan li.now button{border-color:var(--gold);background:#3a2a10}.plan small{float:right;color:var(--muted)}
.row.big button{font-size:18px;padding:14px 18px}
.statement{background:#17153a;border:2px solid #3f3a7a;padding:10px 12px;margin:8px 0}.statement ol,.plist,.prules{padding-left:20px;margin:6px 0}.plist li{margin:6px 0}
.statement img{max-width:100%;background:#fff}.rub{display:grid;gap:6px;margin:8px 0}.rub label{display:flex;gap:10px;align-items:flex-start;background:#1b1940;border:2px solid #3f3a7a;padding:8px;cursor:pointer}.rub input{width:22px;height:22px;min-width:0;margin-top:2px;accent-color:#5de8ed}
h4{color:var(--cyan);margin:12px 0 4px}.printsheet .pitem{border-top:2px solid #514a91;margin-top:14px;padding-top:6px}.printsheet .lines{height:160px;border:1px dashed #8f89c4;margin:8px 0}
@media print{.statement{background:#fff;border:1px solid #999;color:#000}.pitem{break-inside:avoid-page}.psol{background:#f4f4f4;padding:6px}.code{background:#f4f4f4!important;color:#000!important}.hero,.qcard{background:#fff!important;border:0!important;color:#000}h4{color:#000}}
.svgwrap{overflow-x:auto;border:2px solid #514a91;background:#fff;margin:8px 0}.svgwrap .ersvg{display:block;border:0;margin:0;height:auto}
@media (max-width:600px){body{font-size:16px}.brand small{display:none}.hero h1{font-size:22px}.match label{grid-template-columns:1fr}.stat{min-width:48px;padding:2px 5px}.stat small{display:none}.dl .why{padding-left:10px}}
@media print{header,.crumb{display:none}body{background:#fff;color:#000}.block{border:1px solid #999;box-shadow:none;background:#fff;break-inside:avoid}.truco{background:#f4f4f4}.block h3{color:#000}}
</style>
</head>

  x:'<b>Simple</b>: no se descompone (nombre). <b>Compuesto</b>: se divide en partes con sentido (dirección → calle, número, CP). <b>Monovalorado</b>: un valor (email). <b>Multivalorado</b>: varios valores (teléfonos) → <b>doble óvalo</b>. <b>Derivado</b>: se calcula (edad desde fecha_nacimiento) → <b>óvalo discontinuo</b>; no se guarda salvo por rendimiento justificado.',
  k:'Doble óvalo = "doble" de valores (varios). Discontinuo = "no está del todo": se calcula.'},
 {t:'¿Atributo o entidad?',
  x:'Es <b>atributo</b> si no hace falta identificarlo aparte ni referenciarlo (el nombre del cliente). Es <b>entidad</b> si tiene vida propia, varias propiedades o relaciones (un Teléfono con tipo, extensión e histórico). Regla de la lista: si esperas <b>varios valores</b>, piensa en multivalorado o en una entidad.',

  x:'<b>Mínimo</b>: 0 = participación <b>parcial</b> (opcional); 1 = <b>total</b> (obligatoria). <b>Máximo</b>: 1 o N. Tipos: <b>1:1</b>, <b>1:N</b>, <b>N:M</b>.<br>En los <b>dibujos del profe</b> el par va pegado a la entidad que se cuenta: en Departamento — tiene — Empleado, el <b>(1,N)</b> está junto a <b>Empleado</b> (un departamento tiene de 1 a N empleados) y el <b>(1,1)</b> junto a <b>Departamento</b> (cada empleado tiene exactamente 1).<br>Es la <b>convención de clase</b> (dibujos, apartado de lógico y el SQL de clase). Ojo: solo el párrafo «Lectura correcta» de conceptual 4.4 lo escribe al revés; no lo sigas. En el examen escribe la frase al lado de cada par.',
  k:'Primero los mínimos: "¿puede existir un pedido SIN cliente?" Después el máximo: "¿cuántos a la vez?". Y escribe la frase: así no hay lectura posible mala.'},
 {t:'Método para el enunciado (4 pasos)',
  x:'1) Subraya los <b>sustantivos</b> → candidatos a entidad (¿tiene datos propios?). 2) Subraya los <b>verbos</b> → relaciones. 3) En cada relación pregunta por <b>los dos lados</b>: ¿cuántos a la vez? ¿es obligatorio? 4) <b>Contraejemplo</b>: intenta romper el modelo ("¿un pedido sin cliente?"). Si el enunciado dice "puede no tener", el mínimo es 0; si dice "siempre", "todo", "debe", es 1.',

  x:'Superentidad que se especializa en subtipos que heredan su clave y atributos ("Alumno <i>es una</i> Persona"). Dos decisiones independientes:<br>• <b>Disyunta [D]</b> (una instancia solo en un subtipo) o <b>Solapada [O]</b> (puede estar en varios).<br>• <b>Total</b> (doble línea: toda instancia está en algún subtipo) o <b>Parcial</b> (línea simple: puede no estar en ninguno).<br>Ejemplos de la web: Empleado → Técnico | Administrativo (D, total). Vehículo → Coche | Moto (D, parcial). Persona → Alumno | Empleado (O, total). Producto → Perecedero | Refrigerado (O, parcial). Si un subtipo no aporta atributos ni reglas, mejor un atributo <code>tipo</code>.',

  x:'<b>Agregación</b>: "encierras" una relación con sus entidades en una caja y la relacionas con otra entidad. Ejemplo: el <b>Suministro</b> (Proveedor — suministra — Producto) <b>sirve a</b> Almacén. Se usa cuando lo que se relaciona es <b>la combinación</b>, no cada entidad por separado.<br><b>Composición</b>: todo–parte con <b>dependencia de existencia</b> = entidad débil + relación identificadora + participación total (Pedido — contiene — Línea).',
  k:'Agregación = relacionas "la pareja". Composición = la parte muere con el todo.'},
 {t:'Restricciones de integridad',
  x:'<b>Dominio</b>: tipo, rango y formato (precio ≥ 0, DNI con patrón). <b>Entidad</b>: identidad y unicidad (claves). <b>Referencia</b>: existencia de lo relacionado (FK y participación). <b>Semánticas</b>: reglas de negocio que no salen de lo anterior ("un pedido cancelado no tiene líneas"); en el E/R van como <b>notas</b>.',
  k:'D-E-R-S: De qué tipo, Es único, Referencia que existe, Semántica del negocio.'},
 {t:'Errores típicos en el E/R',
  x:'• Poner el (min,max) en el lado equivocado o lejos de la línea.<br>• Olvidar los mínimos (escribir solo 1:N).<br>• Confundir disyunta/solapada o total/parcial.<br>• Conectar por separado lo que debería ir junto (falta agregación o ternaria).<br>• Usar una clave inestable (email) o usar id sin proteger la natural.<br>• Guardar derivados (edad e importe_total) que se desincronizan.<br>• Modelar como dos binarias algo N:M que pide atributo propio.<br>• Crear una entidad para algo que es solo un dato.',
  k:'Antes de entregar: lee cada relación en voz alta en los dos sentidos. Si suena raro, está mal.'},
 {t:'UML en una línea',
  x:'Clase = entidad; atributo en el compartimento del medio; asociación = relación. Multiplicidades: <b>1</b> = (1,1), <b>0..1</b> = (0,1), <b>*</b> o <b>0..*</b> = (0,N), <b>1..*</b> = (1,N). Herencia = ISA. Composición (rombo relleno) = todo–parte con dependencia; agregación (rombo vacío) = todo–parte sin dependencia.',
  k:'UML ya escribe la multiplicidad "al otro lado", como los dibujos E/R del profe.'}

 {t:'La notación de marco',
  x:'<code>T = c1 + c2 + …</code> tabla y columnas (orden: PK → FKs → resto).<br><code>CP(…)</code> clave primaria.<br><code>C.Alt(…)</code> clave alternativa (candidata no elegida).<br><code>C.Aj(x) → T(k)</code> clave ajena que apunta a la PK o a una AK de T.<br><code>VNN(c)</code> valor no nulo.<br><code>ASERCIÓN n: …</code> regla que afecta a varias tablas.<br>En SQL: CP → <code>PRIMARY KEY</code>, C.Alt → <code>UNIQUE</code>, C.Aj → <code>FOREIGN KEY … REFERENCES</code>, VNN → <code>NOT NULL</code>.',
  k:'Las 4 marcas: CP (quién soy), C.Alt (otro DNI mío), C.Aj (a quién apunto), VNN (lo que no puede faltar).'},
 {t:'Clave primaria (CP)',
  x:'<b>Única, mínima y no nula</b>. En SQL la PK ya implica UNIQUE + NOT NULL. Puede ser <b>compuesta</b> (tablas intermedias, débiles, multivalorados); la minimalidad la decides tú, el motor no la comprueba. No se elige "porque es la primera columna", sino por significado.',
  k:'U-M-N: Única, Mínima, No nula. Si sobra una columna para identificar, no es mínima.'},
 {t:'Clave alternativa (C.Alt)',
  x:'Es una candidata que no se eligió como PK; se implementa con <b>UNIQUE</b>. Ojo: UNIQUE <b>admite varios NULL</b>. En los apuntes, por defecto C.Alt permite NULL; si debe ser obligatoria se escribe también <b>VNN</b>: <code>C.Alt(nif)</code> + <code>VNN(nif)</code>.',
  k:'"No puede repetirse" → C.Alt. "Y además todos lo tienen" → + VNN.'},
 {t:'Clave ajena (C.Aj)',
  x:'<code>C.Aj(cliente_id) → CLIENTE(id)</code>. Debe apuntar a una <b>PK o a una AK (UNIQUE)</b> de la otra tabla, con <b>tipos compatibles</b> (mismo tipo, longitud, unsigned, charset). Su nulabilidad sale del E/R: si el hijo <b>no puede existir sin padre</b> → <b>VNN(FK)</b>; si puede → la FK admite NULL.',
  k:'Pregunta mágica: "¿puede existir un PEDIDO sin CLIENTE?". No → VNN(cliente_id).'},

  x:'Tabla nueva con <b>las dos FKs</b> y <b>PK compuesta</b> por ellas. Los <b>atributos de la relación</b> (unidades, precio de ese momento) van aquí.<pre>LINEA = pedido_id + producto_id + unidades + precio_ud\nCP(pedido_id, producto_id)\nC.Aj(pedido_id)   → PEDIDO(id)\nC.Aj(producto_id) → PRODUCTO(id)\nVNN(unidades)  VNN(precio_ud)</pre>',
  k:'N:M = "puente": dos FKs que juntas forman la CP. Si a la CP le falta una FK, el puente se cae.'},
 {t:'1:1, reflexiva y ternaria',
  x:'<b>1:1</b>: FK en uno de los lados + <b>UNIQUE</b> (C.Alt) sobre esa FK, para que no se repita. <code>PASAPORTE = id + numero + persona_id · C.Aj(persona_id) → PERSONA(id) · C.Alt(persona_id)</code>.<br><b>Reflexiva 1:N</b>: FK que apunta a la propia tabla: <code>EMPLEADO = dni + nombre + jefe_dni · C.Aj(jefe_dni) → EMPLEADO(dni)</code>. Si puede haber empleado sin jefe, admite NULL.<br><b>Ternaria</b>: tabla con <b>tres FKs</b>; la CP es compuesta (2 o 3 FKs según la regla) y lleva los atributos de la relación (precio).',
  k:'1:1 = FK + UNIQUE (si no fuera UNIQUE, sería un 1:N).'},
 {t:'Débil, multivalorado e ISA',
  x:'<b>Débil</b>: CP = PK de la fuerte + clave parcial: <code>LINEA = pedido_id + pos + … · CP(pedido_id, pos) · C.Aj(pedido_id) → PEDIDO(id)</code>. La relación identificadora no crea tabla.<br><b>Multivalorado</b>: tabla propia con la PK de la base + el valor: <code>TEL_CLI = cliente_id + telefono · CP(cliente_id, telefono)</code>.<br><b>ISA</b>: tabla del supertipo y una por subtipo cuya <b>PK es a la vez FK</b> al supertipo: <code>ALUMNO = id + curso · CP(id) · C.Aj(id) → PERSONA(id)</code>. Total y disyunta se escriben como aserciones.',
  k:'Teléfonos de un cliente nunca en una columna con comas: tabla aparte con CP(cliente, teléfono).'},
 {t:'Aserciones',
  x:'Reglas que afectan a varias tablas y que no salen con CP/C.Aj/VNN:<br>• <b>Cobertura</b> (participación total de B en R): <code>B[b] ⊆ R[b]</code>, p. ej. <code>PRODUCTO[id] ⊆ SUMINISTRO[producto_id]</code> (todo producto se suministra).<br>• <b>Disyunción</b> (ISA excluyente): <code>ALUMNO[id] ∩ PROFESOR[id] = ∅</code>.<br>• <b>Totalidad</b> (ISA total): <code>PERSONA[id] ⊆ ALUMNO[id] ∪ PROFESOR[id]</code>.<br>MySQL no tiene aserciones: se hacen con triggers o en la aplicación.',
  k:'⊆ = "todos están dentro de" (cobertura). ∩ = ∅ = "nadie en los dos" (disyunta).'},
 {t:'Políticas de las FK (ON DELETE / ON UPDATE)',
  x:'<b>RESTRICT / NO ACTION</b>: impide borrar si hay hijos. <b>CASCADE</b>: borra o actualiza también los hijos. <b>SET NULL</b>: pone la FK a NULL; <b>solo si la FK admite NULL</b>. <b>SET DEFAULT</b>: no está en MySQL.<br>Sugerencias de la web: 1:N obligatorio → RESTRICT. Tabla intermedia N:M → CASCADE desde los maestros. Débil → CASCADE desde la fuerte. Reflexiva opcional → SET NULL. ON UPDATE CASCADE si la clave natural puede cambiar.',
  k:'SET NULL con VNN es imposible: no puedes poner a NULL lo que no admite NULL.'},
 {t:'Las 5 preguntas para cada tabla',
  x:'1) ¿Qué columnas identifican cada fila de forma <b>única, mínima y no nula</b>? → CP.<br>2) ¿Hay identificadores <b>naturales</b> que no se pueden repetir? → C.Alt.<br>3) ¿Qué columnas <b>apuntan</b> a otra tabla y a qué clave exacta? → C.Aj.<br>4) ¿Qué columnas son <b>obligatorias</b>? → VNN.<br>5) ¿La CP es <b>compuesta</b>? (sobre todo en intermedias).',
  k:'C-A-A-V-C: CP, Alternativas, Ajenas, VNN, ¿Compuesta?'},
 {t:'Errores frecuentes al pasar a tablas',
  x:'• Poner la FK en el lado 1 de un 1:N.<br>• Crear tabla intermedia para un 1:N.<br>• Tabla intermedia con CP a la que le falta una de las FKs.<br>• Olvidar VNN en una FK obligatoria, o ponerlo en una opcional.<br>• Identificador natural sin C.Alt (dos filas con la misma matrícula).<br>• C.Aj apuntando a una columna que no es PK ni UNIQUE.<br>• Guardar el atributo de la relación en una de las entidades.',
  k:'Repasa cada tabla con las 5 preguntas y cada FK con "¿puede existir sin…?".'}
 ]},

{id:'ddl', icon:'⌗', name:'SQL · DDL', exam:true,
 subtitle:'CREATE TABLE, tipos, restricciones, NULL y ALTER TABLE',
 ref:'sql.md · 2. DDL (apartados 1 a 11) · Parte 3 del examen: validar el DDL contra el enunciado E/R y explicar por qué está mal',
 blocks:[
 {t:'Base de datos, charset y motor',
  x:'<code>CREATE DATABASE tienda CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;</code> <b>utf8mb4</b> admite cualquier carácter (también emojis). <b>InnoDB</b> es el motor por defecto y el único con <b>claves ajenas</b> y transacciones. <code>DROP DATABASE IF EXISTS</code> y <code>CREATE … IF NOT EXISTS</code> evitan errores al repetir scripts.',
  k:'Sin InnoDB no hay FOREIGN KEY: "Inno" = Integridad.'},
 {t:'Tipos de datos',
  x:'Enteros: <code>TINYINT, SMALLINT, INT, BIGINT</code> (el más pequeño que sirva). Dinero: <b><code>DECIMAL(p,s)</code></b>, p. ej. DECIMAL(10,2); nunca FLOAT/DOUBLE para importes. Texto: <code>CHAR(n)</code> longitud fija (DNI, códigos), <code>VARCHAR(n)</code> variable, <code>TEXT</code> largo. Fechas: <code>DATE</code>, <code>DATETIME</code>, <code>TIMESTAMP</code> (rango aproximado 1970-2038). <code>ENUM</code> útil pero rígido. <code>BOOLEAN</code> = TINYINT(1).',
  k:'DECIMAL = Dinero. CHAR = Cosas de largo fijo (DNI 9). VARCHAR = Variable.'},
 {t:'CREATE TABLE bien formado',
  x:'<pre>CREATE TABLE pedidos (\n  id          INT AUTO_INCREMENT,\n  cliente_id  INT NOT NULL,\n  fecha       DATE NOT NULL,\n  total       DECIMAL(10,2) NOT NULL DEFAULT 0,\n  CONSTRAINT pk_pedidos PRIMARY KEY (id),\n  CONSTRAINT fk_pedidos_cliente FOREIGN KEY (cliente_id)\n    REFERENCES clientes(id)\n    ON UPDATE CASCADE ON DELETE RESTRICT\n) ENGINE=InnoDB;</pre>Poner nombre a las restricciones (<code>CONSTRAINT nombre</code>) permite borrarlas luego.',
  k:'Orden mental: columnas → PK → UNIQUE → CHECK → FK.'},
 {t:'PRIMARY KEY y AUTO_INCREMENT',
  x:'Una tabla tiene <b>una sola</b> PRIMARY KEY. Se puede poner en la columna (<code>id INT AUTO_INCREMENT PRIMARY KEY</code>) <b>o</b> al final (<code>PRIMARY KEY (id)</code>), pero <b>no en los dos sitios</b>. La compuesta se declara <b>una vez con las dos columnas</b>: <code>PRIMARY KEY (cliente_id, producto_id)</code>; escribir PRIMARY KEY en cada columna es un error.',
  k:'Una tabla, una PK. Compuesta = un solo PRIMARY KEY con paréntesis y comas.'},
 {t:'FOREIGN KEY: las 3 condiciones',
  x:'1) La tabla referenciada <b>tiene que existir antes</b> (orden de creación), o la FK se añade luego con ALTER TABLE.<br>2) La columna referenciada debe ser <b>PRIMARY KEY o UNIQUE</b>.<br>3) Los <b>tipos</b> deben coincidir (INT con INT, mismo largo de VARCHAR/CHAR, mismo charset).<br>Además, <code>ON DELETE SET NULL</code> exige que la FK <b>admita NULL</b>.',
  k:'Existe, es clave, es del mismo tipo. Si falla una, la FK falla.'},
 {t:'NULL, NOT NULL, UNIQUE, DEFAULT y CHECK',
  x:'<b>NULL ≠ 0 ≠ \'\'</b>: significa "desconocido". Una columna <b>sin NOT NULL admite NULL</b>. <b>UNIQUE admite varios NULL</b> (NULL no es igual a NULL); para "único y obligatorio": <code>NOT NULL UNIQUE</code>. <code>DEFAULT</code> da valor por defecto. <code>CHECK (precio &gt;= 0)</code> se aplica desde MySQL <b>8.0.16</b> (antes se ignoraba).',
  k:'El silencio también decide: si no escribes NOT NULL, has dicho "opcional".'},
 {t:'ALTER TABLE',
  x:'<code>ADD COLUMN</code> añade, <code>MODIFY</code> cambia tipo o NULL, <code>CHANGE</code> cambia nombre y tipo, <code>RENAME COLUMN a TO b</code> (8.0+), <code>ADD CONSTRAINT … FOREIGN KEY</code>, <code>DROP FOREIGN KEY nombre</code> (necesitas el nombre; míralo con <code>SHOW CREATE TABLE</code>), <code>ADD UNIQUE</code>, <code>DROP INDEX</code>.',
  k:'MODIFY = Mismo nombre, otro tipo. CHANGE = Cambio de nombre (y tipo).'},
 {t:'Validar un script DDL: los 8 errores que se plantan',
  x:'1) <b>PK</b> que falta, duplicada o mal puesta.<br>2) <b>FK mal referenciada</b>: apunta a otra tabla o a una columna que no es PK/UNIQUE.<br>3) <b>FK que falta</b>: lado N sin FK o intermedia sin sus dos FKs.<br>4) <b>NOT NULL</b> que falta (obligatorio) o que sobra (opcional).<br>5) <b>UNIQUE</b> que falta en el identificador natural.<br>6) <b>Tipos incoherentes</b> (FK INT contra PK VARCHAR, fecha como texto).<br>7) <b>Orden de creación</b>: FK hacia una tabla que aún no existe.<br>8) <b>PK compuesta mal definida</b> (le falta una columna o va columna a columna).',
  k:'Repasa cada CREATE con 6 preguntas: ¿PK? ¿FKs? ¿NOT NULL? ¿UNIQUE? ¿tipos? ¿orden?'},
 {t:'Antipatrones',
  x:'VARCHAR(255) "porque sí" (elige tamaños razonables). Abusar de ENUM (rígido para cambios). "No pongo claves ajenas porque lo controlo en la aplicación": la base de datos <b>debe</b> hacer cumplir la integridad. Mezclar charsets y collations entre tablas.',
  k:'La integridad se defiende en la BD, no en la app.'}
 ]},

{id:'dml', icon:'▶', name:'SQL · DML', exam:false,
 subtitle:'SELECT de una tabla, funciones, GROUP BY, INSERT, UPDATE, DELETE y existencialidad',
 ref:'sql.md · 3. DML y 3.c CRUD · Boletines SQL (Huerto, Ciclismo, Instituto) · No es una parte del examen, pero sirve para los boletines',
 blocks:[
 {t:'SELECT sobre una tabla',
  x:'<code>SELECT col AS alias, (precio*stock) AS valor FROM t WHERE … ORDER BY col DESC LIMIT 5 OFFSET 0;</code><br>Filtros: <code>= &lt;&gt; &gt; &gt;= &lt; &lt;=</code>, <code>AND OR NOT</code>, <code>IN (…)</code>, <code>BETWEEN a AND b</code> (incluye los extremos), <code>LIKE \'S%\'</code> (% = cualquier cadena, _ = un carácter), <code>IS NULL</code>. <code>DISTINCT</code> quita duplicados. <code>ORDER BY</code> por defecto es ASC.',
  k:'LIKE: % = "lo que sea", _ = "exactamente uno". Cuatro letras = \'____\'.'},
 {t:'NULL en las consultas',
  x:'<code>col = NULL</code> <b>nunca es verdadero</b>: se usa <code>IS NULL</code> / <code>IS NOT NULL</code>. <code>COALESCE(tel, \'—\')</code> o <code>IFNULL</code> cambian NULL por otro valor. "Alumnos que tienen teléfono" = <code>WHERE telefono IS NOT NULL</code>.',
  k:'NULL no es igual a nada, ni siquiera a NULL. Con NULL siempre IS.'},
 {t:'Funciones habituales',
  x:'Números: <code>ROUND(x,2)</code>, <code>FLOOR</code>, <code>CEIL</code>, <code>ABS</code>. Cadenas: <code>CONCAT</code>, <code>UPPER</code>, <code>LOWER</code>, <code>SUBSTRING(s, inicio, n)</code>, <code>LENGTH</code> (bytes), <code>CHAR_LENGTH</code> (caracteres), <code>TRIM</code>, <code>REPLACE</code>. Fechas: <code>NOW()</code>, <code>CURDATE()</code>, <code>YEAR()</code>, <code>DAYNAME()</code>, <code>MONTHNAME()</code>, <code>DATEDIFF</code>, <code>TIMESTAMPDIFF(YEAR, fecha_nac, CURDATE())</code> para la edad. Control: <code>CASE WHEN … THEN … ELSE … END</code>.',
  k:'Edad exacta = TIMESTAMPDIFF(YEAR, nacimiento, CURDATE()). Con tildes o ñ, CHAR_LENGTH (LENGTH cuenta bytes).'},
 {t:'Funciones de agregado',
  x:'<code>COUNT(*)</code> cuenta filas. <code>COUNT(col)</code> cuenta los <b>no nulos</b>. <code>COUNT(DISTINCT col)</code> valores distintos. <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> ignoran los NULL. Sin GROUP BY devuelven <b>una sola fila</b> (Boletín 1: edad máxima, total de ciclistas, distancia media…).',
  k:'COUNT(*) = todas las filas; COUNT(columna) = solo las que tienen dato.'},
 {t:'GROUP BY y HAVING',
  x:'<code>GROUP BY</code> hace un grupo por cada valor y calcula el agregado por grupo ("ciclistas por equipo"). <code>HAVING</code> filtra <b>grupos</b> ("equipos con más de 5 ciclistas": <code>HAVING COUNT(*) &gt; 5</code>); <code>WHERE</code> filtra <b>filas</b> antes de agrupar y no admite agregados. Regla de oro: toda columna del SELECT que no sea agregado <b>debe estar en el GROUP BY</b>.',
  k:'WHERE = antes de agrupar (filas). HAVING = después (grupos). "Más de N" de un COUNT → HAVING.'},
 {t:'Orden de las cláusulas',
  x:'Se <b>escribe</b>: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.<br>Se <b>ejecuta</b>: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Por eso el alias del SELECT sí se puede usar en ORDER BY.',
  k:'"Siempre Faltan Whiskys Grandes Hasta Otra Luna": SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT.'},
 {t:'INSERT',
  x:'<code>INSERT INTO t (col1, col2) VALUES (…), (…);</code> Lista las columnas; las AUTO_INCREMENT y las que tienen DEFAULT se pueden omitir. Falla si: la <b>PK ya existe</b> (duplicado), un <b>UNIQUE</b> se repite, una columna <b>NOT NULL</b> queda sin valor o NULL, la <b>FK no existe</b> en la tabla padre, o un <b>CHECK</b> no se cumple. <code>ON DUPLICATE KEY UPDATE</code> actualiza si choca; <code>REPLACE</code> borra e inserta (dispara los ON DELETE).',
  k:'Antes de insertar: ¿ya existe esa PK? ¿existe el padre de la FK? ¿me dejo algún NOT NULL?'},
 {t:'UPDATE y DELETE',
  x:'<code>UPDATE t SET col = valor WHERE …;</code> <code>DELETE FROM t WHERE …;</code> <b>Sin WHERE afectan a todas las filas</b>. El modo seguro (<code>SQL_SAFE_UPDATES</code>) exige WHERE con clave o LIMIT. Un DELETE de una fila <b>referenciada</b> falla si la FK es RESTRICT/NO ACTION, borra los hijos si es CASCADE o los deja a NULL si es SET NULL. <code>TRUNCATE TABLE</code> vacía la tabla y reinicia el AUTO_INCREMENT (es DDL).',
  k:'UPDATE o DELETE sin WHERE = toda la tabla. Casi siempre es el error que buscan.'},
 {t:'Existencialidad: la pregunta del examen',
  x:'Aunque la sentencia toque <b>una sola tabla</b>, el error sale de lo que <b>existe o no</b>:<br>• INSERT con FK → el padre <b>debe existir</b>.<br>• INSERT con PK → la PK <b>no debe existir</b>.<br>• INSERT en NOT NULL → no puede ser NULL.<br>• UPDATE de PK/FK → el nuevo valor debe no existir (PK) o existir (FK).<br>• DELETE de una fila con hijos → no se puede (sin CASCADE).<br>• UPDATE/DELETE sin WHERE → todas las filas.<br>• SELECT con GROUP BY → columnas no agregadas en el GROUP BY.',
  k:'Tres preguntas: ¿ya existía lo que meto? ¿existe aquello a lo que apunto? ¿alguien depende de lo que borro?'},
 {t:'Transacciones',
  x:'<code>START TRANSACTION; … COMMIT;</code> confirma; <code>ROLLBACK;</code> deshace. Se usan cuando varios cambios deben ir juntos (alta de cliente y su pedido). Garantizan <b>ACID</b>. Una sentencia DDL hace un <b>COMMIT implícito</b>.',
  k:'Transferencia bancaria: o se hacen cargo y abono, o ninguno.'}
 ]},

{id:'norm', icon:'≡', name:'Normalización', exam:false,
 subtitle:'Dependencias funcionales, anomalías y 1FN, 2FN, 3FN, FNBC',
 ref:'logico.md · 6) Normalización · Boletín normalización (notación DeMarco)',
 blocks:[
 {t:'Por qué normalizar: las 3 anomalías',
  x:'Si todo va en una tabla (pedido + cliente + producto en cada línea) hay <b>redundancia</b> y aparecen:<br>• <b>Inserción</b>: no puedes dar de alta un producto sin inventarte un pedido.<br>• <b>Actualización</b>: cambias el nombre del cliente en una fila y no en otra → inconsistencia.<br>• <b>Borrado</b>: al borrar el único pedido de un cliente pierdes los datos del cliente.',
  k:'I-A-B: Insertar, Actualizar, Borrar. Las tres nacen de repetir datos.'},
 {t:'Dependencia funcional y claves',
  x:'<b>DF X → Y</b>: si dos filas coinciden en X, coinciden en Y (dni → nombre). <b>Superclave</b>: identifica cada fila. <b>Clave candidata</b>: superclave <b>mínima</b>. <b>Atributo primo</b>: forma parte de alguna clave candidata. <b>Cierre X⁺</b>: todo lo que se deduce desde X aplicando las DF; si X⁺ contiene todos los atributos, X es superclave.',
  k:'X → Y se lee "X determina Y": sabiendo X, sabes Y.'},
 {t:'Notación del boletín (DeMarco)',
  x:'<code>RELACIÓN = atributo + {atributos} + [atributos]</code>. <b>{ }</b> = repetición (grupo repetitivo), <b>[ ]</b> = opcional, <b>( )</b> = composición, <b>subrayado</b> = clave primaria. <code>DF = { c1 → c2 }</code> = conjunto de dependencias funcionales.',
  k:'Llaves { } = "se repite" → rompe la 1FN.'},
 {t:'1FN: valores atómicos',
  x:'Sin atributos multivalorados ni grupos repetitivos: cada celda, un solo valor. Lo que se repite sale a <b>otra tabla</b> con la clave de la original. Ejemplo: <code>X = a0 + a1 + {x + y + z}</code> → <code>X1 = a0 + a1</code> y <code>X2 = a0 + x + y + z</code> (clave a0 + la parte que identifica cada repetición).',
  k:'1FN = "1 valor por celda".'},
 {t:'2FN: nada depende de media clave',
  x:'Solo importa si la <b>CP es compuesta</b>. Ningún atributo no primo puede depender de <b>una parte</b> de la clave (dependencia parcial). Ejemplo: <code>LINEA(pedido_id, producto_id, unidades, fecha_pedido)</code>: fecha_pedido depende solo de pedido_id → se lleva a PEDIDO.<br>Si la CP es de una sola columna y está en 1FN, ya está en 2FN.',
  k:'2FN = "toda la clave". Si un dato se entera con media clave, fuera.'},
 {t:'3FN: sin transitivas',
  x:'En 2FN y sin <b>dependencias transitivas</b>: un atributo no primo no puede depender de otro no primo. <code>pedido_id → cliente_id → cliente_nombre</code>: el nombre se va a CLIENTE.',
  k:'3FN = "nada más que la clave". Si depende de un "intermediario", el intermediario se lleva su tabla.'},
 {t:'FNBC (Boyce-Codd)',
  x:'Para toda DF no trivial X → Y, <b>X tiene que ser superclave</b>. Es más estricta que 3FN (la 3FN permite X → A si A es primo). Pasar a FNBC puede <b>perder la preservación</b> de alguna DF; en FP se suele quedar en 3FN. Ejemplo del boletín: <code>FIGURAS = nombre + color + tamaño</code>, con C.Alt (color + tamaño) y DF tamaño → nombre: tamaño no es superclave → no está en FNBC.',
  k:'FNBC = "todo el que determina, es clave".'},
 {t:'Descomposición correcta',
  x:'<b>Sin pérdida</b>: al partir R en R1 y R2, la parte común <b>R1 ∩ R2</b> tiene que ser superclave de R1 o de R2 (así el JOIN recompone sin filas falsas). <b>Preservar DF</b>: cada DF debe poder comprobarse en alguna tabla.<br>Síntesis a 3FN: 1) cobertura mínima de las DF; 2) una tabla por cada determinante con lo que determina; 3) si ninguna tabla contiene una clave candidata, añade una; 4) quita las tablas contenidas en otras.',
  k:'Lo que comparten las dos tablas tiene que ser clave de alguna. Si no, el JOIN se inventa filas.'},
 {t:'Desnormalizar a propósito',
  x:'A veces se repite un dato por rendimiento (boletín, ejercicio 7: ventas con importes calculados). Se hace <b>conscientemente</b>, documentando qué regla se rompe y cómo se recalcula. El <b>precio en la línea</b> del pedido no es redundancia: guarda el precio de ese momento (histórico).',
  k:'Precio de la línea ≠ pvp del producto: uno es "lo que pagó", el otro "lo que cuesta hoy".'}
 ]},

{id:'alm', icon:'◫', name:'Almacenamiento', exam:false,
 subtitle:'Datos e información, ficheros, SGBD, ACID, NoSQL y CAP',
 ref:'almacenamiento.md · Actividades Ficheros y SGBD',
 blocks:[
 {t:'Dato e información',
  x:'<b>Dato</b>: valor aislado sin significado completo (25). <b>Información</b>: datos con contexto e interpretación ("el 15/06/2024 en Valencia hubo 25 ºC"). Escalera: dato → información → <b>conocimiento</b> (aplicarla) → <b>sabiduría</b> (usarla con juicio).',
  k:'El dato es el ladrillo; la información, la pared con sentido.'},
 {t:'Problemas de los ficheros',
  x:'<b>Redundancia</b> (lo mismo en varios ficheros) → <b>inconsistencia</b> (se actualiza uno y no los otros). <b>Acceso difícil</b> (recorrer el fichero entero). <b>Poca seguridad</b>. <b>Sin integridad</b> (nadie impide una edad negativa). <b>Mantenimiento caro</b> (cambiar la estructura obliga a reprogramar). <b>Concurrencia limitada</b> (dos personas editando a la vez). <b>Sin copias automáticas</b>.',
  k:'Redundancia es la madre, inconsistencia la hija: si repites, tarde o temprano no coincide.'},
 {t:'Base de datos y SGBD',
  x:'Una <b>base de datos</b> es un almacén estructurado y centralizado que garantiza consistencia, integridad y disponibilidad. Aporta: centralización, menos redundancia, integridad, seguridad, escalabilidad, consultas flexibles (SQL), copias y recuperación, y control de concurrencia. El <b>SGBD</b> es el conjunto de programas que la gestiona (definir, insertar, consultar, transacciones, seguridad, recuperación).',
  k:'BD = el almacén. SGBD = el encargado del almacén.'},
 {t:'Tipos de SGBD',
  x:'<b>Jerárquicos</b> (árbol padre-hijo, años 60-70, IBM IMS). <b>En red</b> (grafo, IDMS). <b>Relacionales</b> (tablas, desde los 80: Oracle, MySQL, PostgreSQL, SQL Server, MariaDB). <b>Orientados a objetos</b> (ObjectDB, db4o). <b>NoSQL</b> (clave-valor, documentos, columnas, grafos).',
  k:'Historia: Árbol → Red → Tabla → Objeto → NoSQL.'},
 {t:'Componentes de un SGBD',
  x:'<b>Motor de almacenamiento</b> (disco, índices, buffers). <b>Procesador de consultas</b> (parser, optimizador, ejecutor). <b>Gestor de transacciones</b> (ACID, concurrencia, recuperación). <b>Gestor de seguridad</b> (usuarios, roles, permisos). <b>Catálogo o diccionario de datos</b> (metainformación: tablas, vistas, índices, permisos). <b>Gestor de copias</b> (completas, incrementales, diferenciales).',
  k:'Catálogo = "el mapa" de la base de datos: datos sobre los datos.'},
 {t:'Modelo relacional',
  x:'Propuesto por <b>Edgar F. Codd en 1970</b>. Relación = <b>tabla</b>, tupla = <b>fila</b>, atributo = <b>columna</b>. PK identifica cada fila (sin duplicados ni nulos), FK enlaza tablas (integridad referencial), índices aceleran búsquedas, vistas son tablas virtuales. Escala en <b>vertical</b> (servidor más potente).',
  k:'Codd 1970, Chen 1976: primero las tablas, después el dibujo E/R.'},
 {t:'ACID',
  x:'<b>Atomicidad</b>: todo o nada. <b>Consistencia</b>: de un estado válido a otro válido. <b>Aislamiento</b>: las transacciones a la vez no se pisan. <b>Durabilidad</b>: lo confirmado sobrevive a una caída.',
  k:'Transferencia: si falla el cargo no hay abono (A); el total cuadra (C); dos no compran el último artículo (I); el pago confirmado no se pierde (D).'},
 {t:'NoSQL y sus 4 tipos',
  x:'"Not only SQL": escalabilidad <b>horizontal</b> (más servidores), esquema flexible, alto rendimiento y disponibilidad.<br>• <b>Documentales</b> (JSON/BSON): MongoDB, CouchDB → webs, catálogos.<br>• <b>Clave-valor</b>: Redis, DynamoDB → cachés, sesiones, carritos.<br>• <b>Columnares</b>: Cassandra, HBase → big data, series temporales.<br>• <b>Grafos</b>: Neo4j → redes sociales, recomendaciones, fraude.',
  k:'Mongo = documentos, Redis = Rápido (caché), Cassandra = Columnas, Neo4j = Nodos.'},
 {t:'Teorema CAP',
  x:'Eric Brewer, 2000. En un sistema distribuido solo puedes garantizar <b>2 de 3</b>: <b>C</b>onsistencia (todos ven lo mismo), <b>A</b>vailability/disponibilidad (siempre responde), <b>P</b>artition tolerance (sigue aunque se corte la red). <b>CP</b>: HBase, MongoDB en modo consistente. <b>AP</b>: Cassandra, DynamoDB, CouchDB (consistencia eventual). <b>CA</b>: relacional en un solo servidor (MySQL, PostgreSQL).',
  k:'Elige 2 de 3, como "bueno, bonito y barato".'},
 {t:'SQL frente a NoSQL',

 ddl:`CREATE TABLE asistentes ( ⟦e1⟧

  nombre_completo VARCHAR(100) NOT NULL,

  pais            VARCHAR(50)

CREATE TABLE director (
  id_director     INT AUTO_INCREMENT PRIMARY KEY,
  nombre_completo VARCHAR(100) NOT NULL,
  email           VARCHAR(120)
);

CREATE TABLE pelicula (
  id_pelicula          INT AUTO_INCREMENT PRIMARY KEY,
  titulo               VARCHAR(150) NOT NULL,
  anio_estreno         SMALLINT NOT NULL,
  duracion             SMALLINT NOT NULL,
  id_director          INT, ⟦e2⟧
  id_pelicula_original INT NOT NULL, ⟦e3⟧
  FOREIGN KEY (id_director) REFERENCES director(id_director),
  FOREIGN KEY (id_pelicula_original) REFERENCES pelicula(id_pelicula)
);

CREATE TABLE etiqueta (
  id_etiqueta INT AUTO_INCREMENT PRIMARY KEY,
  nombre      VARCHAR(40) NOT NULL
);

CREATE TABLE pelicula_etiqueta (
  id_pelicula INT NOT NULL,
  id_etiqueta INT NOT NULL,
  PRIMARY KEY (id_pelicula), ⟦e4⟧
  FOREIGN KEY (id_pelicula) REFERENCES pelicula(id_pelicula),
  FOREIGN KEY (id_etiqueta) REFERENCES etiqueta(id_etiqueta)
);

CREATE TABLE sala (
  codigo_sala INT AUTO_INCREMENT PRIMARY KEY,
  ubicacion   VARCHAR(80) NOT NULL,
  aforo       SMALLINT NOT NULL
);

CREATE TABLE proyeccion (
  id_proyeccion INT AUTO_INCREMENT PRIMARY KEY,
  fecha         DATE NOT NULL,
  id_pelicula   INT NOT NULL,
  codigo_sala   INT NOT NULL,
  FOREIGN KEY (id_pelicula) REFERENCES pelicula(id_pelicula) ⟦e5~⟧
); ⟦e5⟧

CREATE TABLE entrada (

  FOREIGN KEY (id_proyeccion) REFERENCES proyeccion(id_proyeccion),

 ddl:`CREATE TABLE vecino (
  dni_vecino        CHAR(9) PRIMARY KEY,
  nombre_vecino     VARCHAR(50) NOT NULL,
  apellido1_vecino  VARCHAR(50) NOT NULL,
  apellido2_vecino  VARCHAR(50)
);

CREATE TABLE monitor (
  dni_monitor       CHAR(9) PRIMARY KEY,
  nombre_monitor    VARCHAR(50) NOT NULL,
  apellido1_monitor VARCHAR(50) NOT NULL,
  apellido2_monitor VARCHAR(50) NOT NULL, ⟦e1⟧
  fecha_celebracion DATE NOT NULL ⟦e2⟧
);

CREATE TABLE taller (
  id_taller   INT AUTO_INCREMENT PRIMARY KEY,
  cupo        SMALLINT NOT NULL,
  dni_monitor CHAR(9), ⟦e3⟧
  FOREIGN KEY (dni_monitor) REFERENCES monitor(dni_monitor)
);

CREATE TABLE parcela (
  id_parcela  INT AUTO_INCREMENT PRIMARY KEY,
  metros      DECIMAL(6,2) NOT NULL,
  orientacion VARCHAR(10),
  dni_vecino  CHAR(9) NOT NULL, ⟦e4⟧
  FOREIGN KEY (dni_vecino) REFERENCES vecino(dni_vecino)
);

CREATE TABLE se_apunta (
  dni_vecino  CHAR(9) NOT NULL,
  id_taller   INT NOT NULL,
  fecha_alta  DATE NOT NULL,
  PRIMARY KEY (dni_vecino), ⟦e5⟧
  FOREIGN KEY (dni_vecino) REFERENCES vecino(dni_vecino),
  FOREIGN KEY (id_taller) REFERENCES taller(id_taller)
);`,

{id:'tb1',topic:'tab',type:'choice',title:'¿Dónde va la FK?',q:'Cliente —realiza— Pedido es 1:N (un cliente, muchos pedidos). ¿Dónde va la clave ajena?',opts:[['En PEDIDO: cliente_id → CLIENTE(id)',true,'La FK va en el lado N: cada pedido apunta a su único cliente.'],['En CLIENTE: pedido_id → PEDIDO(id)',false,'Un cliente tiene muchos pedidos: no caben en una columna.'],['En una tabla intermedia',false,'Una 1:N nunca necesita tabla intermedia.'],['En las dos tablas',false,'Duplica y desincroniza.']],truco:'La FK viaja a los "muchos".'},
{id:'tb2',topic:'tab',type:'choice',title:'N:M',q:'Pedido incluye Producto (N:M) con el atributo unidades. ¿Cómo queda?',opts:[['Tabla LINEA con CP(pedido_id, producto_id), las dos C.Aj y unidades',true,'Tabla intermedia con CP compuesta por las dos FKs y el atributo de la relación.'],['FK producto_id en PEDIDO',false,'Un pedido tiene muchos productos.'],['FK pedido_id en PRODUCTO',false,'Un producto está en muchos pedidos.'],['Tabla LINEA con CP(pedido_id)',false,'Solo cabría un producto por pedido.']],truco:'N:M = puente con dos FKs que juntas son la CP.'},
{id:'tb3',topic:'tab',type:'choice',title:'¿VNN o NULL?',q:'"Todo pedido pertenece a un cliente". En PEDIDO, ¿cómo es cliente_id?',opts:[['C.Aj + VNN',true,'Un pedido no puede existir sin cliente → no admite NULL.'],['C.Aj que admite NULL',false,'Permitiría pedidos sin cliente.'],['C.Alt',false,'Muchos pedidos tienen el mismo cliente: no es único.'],['CP',false,'La CP del pedido es su propio id.']],truco:'¿Puede existir un PEDIDO sin CLIENTE? No → VNN.'},
{id:'tb4',topic:'tab',type:'choice',title:'Jefe opcional',q:'EMPLEADO = dni + nombre + jefe_dni. Un empleado puede no tener jefe. ¿Qué escribes?',opts:[['C.Aj(jefe_dni) → EMPLEADO(dni), sin VNN',true,'Reflexiva: FK a la propia tabla, y admite NULL porque es opcional.'],['C.Aj(jefe_dni) → EMPLEADO(dni) + VNN',false,'Obligaría a que todos tengan jefe (¿y el director?).'],['Tabla JEFE aparte',false,'Una reflexiva 1:N se resuelve con una FK en la misma tabla.'],['C.Alt(jefe_dni)',false,'Un jefe tiene varios subordinados: se repite.']],truco:'Reflexiva = FK que apunta a su propia tabla.'},
{id:'tb5',topic:'tab',type:'choice',title:'1:1',q:'Persona tiene 0 o 1 pasaporte y cada pasaporte es de una persona. FK persona_id en PASAPORTE. ¿Qué más hace falta?',opts:[['C.Alt(persona_id) (UNIQUE) y VNN(persona_id)',true,'UNIQUE para que una persona no tenga dos pasaportes; VNN porque todo pasaporte es de alguien.'],['Nada más',false,'Sin UNIQUE sería un 1:N.'],['Tabla intermedia',false,'En 1:1 se evita.'],['CP(persona_id, id)',false,'No es una N:M.']],truco:'1:1 = FK + UNIQUE.'},
{id:'tb6',topic:'tab',type:'choice',title:'Teléfonos',q:'Un cliente tiene varios teléfonos (multivalorado). ¿Cómo se pasa a tablas?',opts:[['TEL_CLI = cliente_id + telefono · CP(cliente_id, telefono) · C.Aj(cliente_id) → CLIENTE(id)',true,'Tabla propia con CP compuesta (base + valor).'],['Columna telefonos con los números separados por comas',false,'Rompe la 1FN: no puedes buscar ni validar uno a uno.'],['telefono1, telefono2, telefono3 en CLIENTE',false,'Grupo repetitivo: ¿y si tiene cuatro?'],['C.Alt(telefono) en CLIENTE',false,'Sigue siendo una sola columna.']],truco:'Lista = tabla aparte.'},
{id:'tb7',topic:'tab',type:'choice',title:'Débil',q:'LINEA es débil de PEDIDO con clave parcial pos. ¿Cuál es su CP?',opts:[['CP(pedido_id, pos)',true,'PK de la fuerte + clave parcial.'],['CP(pos)',false,'Todas las primeras líneas tendrían pos 1.'],['CP(pedido_id)',false,'Un pedido tiene varias líneas.'],['CP(id) inventado',false,'Se puede, pero no es el mapeo de la débil.']],truco:'Débil = clave del "padre" + su número.'},
{id:'tb8',topic:'tab',type:'choice',title:'ISA en tablas',q:'Persona → Alumno | Profesor. ¿Cuál es la CP de la tabla ALUMNO?',opts:[['id, que además es C.Aj → PERSONA(id)',true,'El subtipo hereda la clave: es a la vez CP y FK.'],['Un id_alumno nuevo sin relación',false,'Perderías que es la misma persona.'],['(id, curso)',false,'Curso no identifica.'],['No tiene CP',false,'Toda tabla tiene CP.']],truco:'ISA: la CP del hijo es la FK al padre.'},
{id:'tb9',topic:'tab',type:'choice',title:'C.Alt y NULL',q:'Pones C.Alt(nif) en CLIENTE. ¿Puede haber dos clientes con nif NULL?',opts:[['Sí: UNIQUE admite varios NULL. Si es obligatorio, añade VNN(nif)',true,'NULL no es igual a NULL, así que no choca.'],['No, UNIQUE no admite NULL',false,'Sí los admite (varios).'],['Solo uno',false,'Admite varios.'],['Depende del AUTO_INCREMENT',false,'No tiene que ver.']],truco:'"Único y obligatorio" = C.Alt + VNN.'},
{id:'tb10',topic:'tab',type:'choice',title:'¿A qué apunta una FK?',q:'C.Aj(x) → T(k). ¿Qué tiene que ser k?',opts:[['La PK o una clave alternativa (UNIQUE) de T',true,'Si k no es única, no se sabría a qué fila apunta.'],['Cualquier columna de T',false,'Tiene que ser única.'],['Una columna NOT NULL',false,'No basta: puede repetirse.'],['Una FK de T',false,'No: una clave de T.']],truco:'Una FK apunta a algo que identifica: PK o UNIQUE.'},
{id:'tb11',topic:'tab',type:'choice',title:'SET NULL',q:'¿Cuándo se puede usar ON DELETE SET NULL en una FK?',opts:[['Solo si la FK admite NULL (participación opcional)',true,'No puedes poner NULL en una columna NOT NULL.'],['Siempre',false,'Con VNN falla.'],['Solo en tablas intermedias',false,'Ahí suele ir CASCADE.'],['Solo si la FK es PK',false,'La PK no admite NULL.']],truco:'SET NULL + VNN = imposible.'},
{id:'tb12',topic:'tab',type:'choice',title:'Política de la débil',q:'¿Qué política de borrado sugiere la web para LINEA (débil) respecto a PEDIDO?',opts:[['ON DELETE CASCADE',true,'Si borras el pedido, sus líneas no tienen sentido.'],['ON DELETE SET NULL',false,'La FK de la débil es VNN (y parte de la CP).'],['Ninguna',false,'Hay que decidirla.'],['ON DELETE RESTRICT siempre',false,'Para la débil se sugiere CASCADE.']],truco:'La parte muere con el todo → CASCADE.'},
{id:'tb13',topic:'tab',type:'choice',title:'Cobertura',q:'"Todo producto aparece en algún suministro". ¿Cómo se expresa en el marco?',opts:[['ASERCIÓN: PRODUCTO[id] ⊆ SUMINISTRO[producto_id]',true,'La participación total del lado "uno" no sale con FK: es una aserción de cobertura.'],['VNN(id) en PRODUCTO',false,'La CP ya es no nula; no obliga a aparecer en otra tabla.'],['C.Aj en PRODUCTO',false,'Producto no apunta a suministro.'],['C.Alt(producto_id)',false,'Un producto puede aparecer varias veces.']],truco:'⊆ = "todos están dentro de".'},
{id:'tb14',topic:'tab',type:'choice',title:'CP mínima',q:'En LINEA(pedido_id, producto_id, unidades) con CP(pedido_id, producto_id, unidades), ¿qué falla?',opts:[['No es mínima: unidades sobra',true,'Con (pedido_id, producto_id) ya se identifica; añadir unidades permitiría repetir el par.'],['No es única',false,'Única es, pero no mínima.'],['Admite NULL',false,'Las columnas de la CP no admiten NULL.'],['Nada',false,'Sobra una columna.']],truco:'U-M-N: si sobra una columna, no es mínima.'},
{id:'tb15',topic:'tab',type:'match',title:'Marco → SQL',prompt:'Une cada marca del marco con su SQL.',pairs:[['CP(a, b)','PRIMARY KEY (a, b)','Clave primaria.'],['C.Alt(x)','UNIQUE (x)','Clave alternativa.'],['C.Aj(f) → T(k)','FOREIGN KEY (f) REFERENCES T(k)','Clave ajena.'],['VNN(c)','c … NOT NULL','Valor no nulo.'],['ASERCIÓN','Trigger o lógica de la aplicación','MySQL no tiene aserciones.']],truco:'CP, Alt, Aj, VNN: quién soy, otro DNI, a quién apunto, lo que no falta.'},
{id:'tb16',topic:'tab',type:'match',title:'Patrón → tabla',prompt:'Une cada patrón del E/R con cómo se pasa a tablas.',pairs:[['1:N','FK en el lado N','Sin tabla nueva.'],['N:M','Tabla intermedia con CP compuesta','Con los atributos de la relación.'],['1:1','FK en un lado + UNIQUE','Para que no se repita.'],['Multivalorado','Tabla propia CP(base, valor)','Un valor por fila.'],['Reflexiva 1:N','FK a la propia tabla','jefe_id → EMPLEADO(id).']],truco:'Solo N:M, ternaria y multivalorado crean tabla nueva.'},
{id:'tb17',topic:'tab',type:'match',title:'Políticas de FK',prompt:'Une cada política con lo que hace.',pairs:[['RESTRICT / NO ACTION','Impide borrar si hay hijos','Protege de huérfanos.'],['CASCADE','Borra también los hijos','Típico en intermedias y débiles.'],['SET NULL','Deja la FK de los hijos a NULL','Solo si la FK admite NULL.'],['SET DEFAULT','No existe en MySQL','Hay que usar otra.']],truco:'Restrict = "no te dejo". Cascade = "me llevo a todos". Set null = "os quedáis sin padre".'},
{id:'tb18',topic:'tab',type:'order',title:'Guía de 5 pasos',q:'Ordena el análisis de claves de una tabla.',steps:['¿Qué identifica cada fila (única, mínima, no nula)? → CP','¿Hay identificadores naturales que no se repiten? → C.Alt','¿Qué columnas apuntan a otra tabla? → C.Aj','¿Qué columnas son obligatorias? → VNN','¿La CP es compuesta?'],why:'Primero la identidad, luego las otras unicidades, las referencias, la obligatoriedad y la revisión de la CP.',truco:'CP, Alt, Aj, VNN, ¿compuesta?'},
{id:'tb19',topic:'tab',type:'short',title:'Escribe: regla del 1:N',q:'Explica dónde va la clave ajena en una relación 1:N y cuándo lleva VNN.',groups:[[' n','muchos','lado n'],['vnn','not null','no nul'],['obligatori','minimo 1','min 1','min=1','sin','siempre','total']],model:'La FK va en la tabla del lado N (los "muchos") apuntando a la PK del lado 1. Lleva VNN cuando la participación es obligatoria (cada fila del lado N tiene siempre su padre, mínimo 1).',why:'Faltaba el lado o la condición del VNN.',truco:'FK a los muchos; VNN si "no puede existir sin".'},
{id:'tb20',topic:'tab',type:'short',title:'Escribe: CP',q:'¿Qué tres condiciones cumple una clave primaria?',groups:[['unica','unico'],['minima','minimo'],['no nula','no nul','not null','vnn']],model:'Única, mínima y no nula.',why:'Son tres: única, mínima y no nula.',truco:'U-M-N.'},
{id:'tb21',topic:'tab',type:'short',title:'Escribe: CP de la N:M',q:'LINEA_UTILIZA = reparacion_id + pieza_codigo + unidades. Escribe su CP y justifica por qué no basta con reparacion_id.',groups:[['reparacion_id'],['pieza_codigo'],['solo una','una pieza','una sola','varias','repet']],model:'CP(reparacion_id, pieza_codigo). Con solo reparacion_id cada reparación podría usar una única pieza, porque no se podría repetir el id; el par sí identifica "esta reparación usa esta pieza".',why:'Había que dar las dos columnas y la consecuencia de quitar una.',truco:'Si quitas una columna de la CP compuesta, pregúntate qué deja de poder repetirse.'},
{id:'tb22',topic:'tab',type:'multi',title:'Errores al pasar a tablas',q:'Marca los que son ERRORES.',opts:[['Crear tabla intermedia para un 1:N',true,'Sobra: basta la FK en el lado N.'],['Poner la FK en el lado 1',true,'No cabe: el lado 1 tiene muchos hijos.'],['VNN en una FK cuya participación es opcional',true,'Impediría filas sin padre que el enunciado permite.'],['C.Alt en la matrícula de un coche con CP id',false,'Correcto: protege el identificador natural.'],['Atributo de la N:M en la tabla intermedia',false,'Correcto: es su sitio.']],truco:'Repasa: lado de la FK, tablas que sobran, VNN según el enunciado.'},

// ======================= DDL =======================
{id:'dd1',topic:'ddl',type:'choice',title:'Dinero',q:'¿Qué tipo usarías para el precio de un producto?',opts:[['DECIMAL(10,2)',true,'Exacto: para dinero.'],['FLOAT',false,'Aproximado: errores de redondeo.'],['VARCHAR(10)',false,'No podrías sumar ni comparar bien.'],['INT',false,'Perderías los céntimos.']],truco:'DECIMAL = Dinero.'},
{id:'dd2',topic:'ddl',type:'choice',title:'DNI',q:'¿Qué tipo es más adecuado para un DNI español (8 números + letra)?',opts:[['CHAR(9)',true,'Longitud fija de 9 caracteres.'],['INT',false,'Perderías la letra.'],['VARCHAR(255)',false,'Tamaño "porque sí": antipatrón.'],['DECIMAL(9,0)',false,'No admite la letra.']],truco:'Largo fijo = CHAR.'},
{id:'dd3',topic:'ddl',type:'choice',title:'Dos PRIMARY KEY',q:'¿Qué pasa con este CREATE?',code:'CREATE TABLE socio (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  nombre VARCHAR(60) NOT NULL,\n  PRIMARY KEY (id)\n);',opts:[['Error: la clave primaria está declarada dos veces',true,'Una tabla tiene una sola PK ("Multiple primary key defined").'],['Está bien: se refuerza',false,'MySQL da error.'],['Crea una PK compuesta',false,'Para compuesta: PRIMARY KEY (a, b) una vez.'],['Solo falla por el AUTO_INCREMENT',false,'El problema es la PK duplicada.']],truco:'Una tabla, una PK: en la columna o al final, nunca en los dos sitios.'},
{id:'dd4',topic:'ddl',type:'choice',title:'PK compuesta mal escrita',q:'¿Qué está mal?',code:'CREATE TABLE matricula (\n  alumno_id INT PRIMARY KEY,\n  curso_id  INT PRIMARY KEY,\n  fecha     DATE NOT NULL\n);',opts:[['La PK compuesta se declara una vez: PRIMARY KEY (alumno_id, curso_id)',true,'Escribir PRIMARY KEY en cada columna son dos PK → error.'],['Falta AUTO_INCREMENT',false,'No hace falta en una intermedia.'],['fecha no puede ser NOT NULL',false,'Puede.'],['Está bien',false,'Da error.']],truco:'Compuesta = un PRIMARY KEY con paréntesis.'},
{id:'dd5',topic:'ddl',type:'choice',title:'Orden de creación',q:'Se ejecuta el script en este orden. ¿Qué pasa?',code:'CREATE TABLE pedido (\n  id INT PRIMARY KEY,\n  cliente_id INT NOT NULL,\n  FOREIGN KEY (cliente_id) REFERENCES cliente(id)\n);\nCREATE TABLE cliente (\n  id INT PRIMARY KEY\n);',opts:[['Error en pedido: cliente aún no existe',true,'La tabla referenciada tiene que existir antes (o añadir la FK con ALTER al final).'],['Funciona: MySQL lo ordena solo',false,'No reordena el script.'],['Error en cliente',false,'cliente está bien.'],['Funciona pero sin FK',false,'Falla el CREATE.']],truco:'Primero los padres, después los hijos.'},
{id:'dd6',topic:'ddl',type:'choice',title:'Tipos de la FK',q:'¿Qué falla?',code:'CREATE TABLE equipo (\n  nomeq VARCHAR(25) PRIMARY KEY\n);\nCREATE TABLE ciclista (\n  dorsal SMALLINT PRIMARY KEY,\n  nomeq  INT NOT NULL,\n  FOREIGN KEY (nomeq) REFERENCES equipo(nomeq)\n);',opts:[['El tipo de la FK (INT) no coincide con el de la PK (VARCHAR(25))',true,'La FK y lo referenciado deben ser del mismo tipo.'],['Falta ON DELETE',false,'Es opcional (por defecto RESTRICT).'],['nomeq no puede ser NOT NULL',false,'Todo ciclista tiene equipo.'],['dorsal debe ser INT',false,'SMALLINT vale.']],truco:'FK: existe, es clave y es del mismo tipo.'},
{id:'dd7',topic:'ddl',type:'choice',title:'FK a columna no clave',q:'¿Qué falla en la última línea?',code:'CREATE TABLE taller (\n  id_taller INT PRIMARY KEY,\n  equipo    VARCHAR(100) NOT NULL\n);\nCREATE TABLE inscripcion (\n  id_taller INT NOT NULL,\n  FOREIGN KEY (id_taller) REFERENCES taller(equipo)\n);',opts:[['Referencia taller(equipo), que no es PK ni UNIQUE (y es de otro tipo)',true,'Debe referenciar taller(id_taller).'],['Falta NOT NULL',false,'Lo tiene.'],['inscripcion necesita AUTO_INCREMENT',false,'No es el error.'],['No falla',false,'MySQL lo rechaza.']],truco:'Una FK apunta a algo que identifica.'},
{id:'dd8',topic:'ddl',type:'choice',title:'SET NULL imposible',q:'¿Qué falla?',code:'CREATE TABLE pedido (\n  id INT PRIMARY KEY,\n  comercial_id INT NOT NULL,\n  FOREIGN KEY (comercial_id) REFERENCES comercial(id)\n    ON DELETE SET NULL\n);',opts:[['SET NULL necesita que comercial_id admita NULL',true,'O se quita NOT NULL (si es opcional) o se usa RESTRICT.'],['ON DELETE no existe',false,'Existe.'],['Falta UNIQUE',false,'Un comercial tiene muchos pedidos.'],['Nada',false,'Es contradictorio.']],truco:'No puedes poner a NULL lo que no admite NULL.'},
{id:'dd9',topic:'ddl',type:'choice',title:'Identificador natural',q:'Enunciado: "la matrícula no puede repetirse". ¿Qué le falta a esta columna?',code:'matricula CHAR(7) NOT NULL,',opts:[['UNIQUE',true,'NOT NULL no evita duplicados; UNIQUE sí (C.Alt).'],['PRIMARY KEY obligatoriamente',false,'Puede ser C.Alt si la PK es un id.'],['DEFAULT',false,'No tiene que ver.'],['Nada',false,'Podrían repetirse matrículas.']],truco:'"No se repite" → UNIQUE. "Obligatorio" → NOT NULL. Son cosas distintas.'},
{id:'dd10',topic:'ddl',type:'choice',title:'Opcional con NOT NULL',q:'Enunciado: "la fecha de salida puede no existir (el coche sigue en el taller)". ¿Qué está mal?',code:'fecha_salida DATE NOT NULL,',opts:[['Sobra NOT NULL: debe admitir NULL',true,'"Puede no existir" = opcional.'],['Debería ser VARCHAR',false,'Una fecha es DATE.'],['Falta UNIQUE',false,'Muchas reparaciones salen el mismo día.'],['Nada',false,'No dejaría registrar coches sin salir.']],truco:'El NOT NULL también puede sobrar.'},
{id:'dd11',topic:'ddl',type:'choice',title:'Sin NOT NULL',q:'Una columna se escribe sin NOT NULL. ¿Qué significa?',opts:[['Que admite NULL (es opcional)',true,'El silencio también decide.'],['Que es obligatoria por defecto',false,'Al revés.'],['Que es única',false,'Eso sería UNIQUE.'],['Que da error',false,'Es válido.']],truco:'Si no escribes NOT NULL, has dicho "opcional".'},
{id:'dd12',topic:'ddl',type:'choice',title:'CHECK',q:'¿Desde qué versión de MySQL se aplican de verdad los CHECK?',opts:[['8.0.16',true,'Antes se aceptaban pero se ignoraban.'],['5.0',false,'Se ignoraban.'],['Siempre se aplicaron',false,'No.'],['Nunca',false,'Desde 8.0.16 sí.']],truco:'CHECK de verdad: MySQL 8.0.16+.'},
{id:'dd13',topic:'ddl',type:'choice',title:'Motor',q:'¿Qué motor de MySQL hace falta para tener claves ajenas?',opts:[['InnoDB',true,'Es el que tiene FK y transacciones.'],['MyISAM',false,'No tiene FK.'],['MEMORY',false,'No tiene FK.'],['Cualquiera',false,'Solo InnoDB.']],truco:'Inno = Integridad.'},
{id:'dd14',topic:'ddl',type:'choice',title:'MODIFY o CHANGE',q:'Quieres cambiar el tipo de telefono a VARCHAR(25) sin cambiarle el nombre.',opts:[['ALTER TABLE clientes MODIFY telefono VARCHAR(25);',true,'MODIFY cambia el tipo con el mismo nombre.'],['ALTER TABLE clientes RENAME telefono VARCHAR(25);',false,'RENAME COLUMN cambia el nombre.'],['UPDATE clientes SET telefono = VARCHAR(25);',false,'UPDATE cambia datos, no estructura.'],['DROP TABLE clientes;',false,'Borras la tabla.']],truco:'MODIFY = mismo nombre. CHANGE = nombre nuevo.'},
{id:'dd15',topic:'ddl',type:'choice',title:'Borrar una FK',q:'¿Qué necesitas para ALTER TABLE pedidos DROP FOREIGN KEY …?',opts:[['El nombre de la restricción (SHOW CREATE TABLE)',true,'Por eso conviene CONSTRAINT nombre.'],['El nombre de la columna',false,'Se borra por el nombre de la restricción.'],['Borrar antes la tabla padre',false,'No hace falta.'],['Nada',false,'Necesitas el nombre.']],truco:'Ponle nombre a tus restricciones: CONSTRAINT fk_pedido_cliente.'},
{id:'dd16',topic:'ddl',type:'choice',title:'UNIQUE y NULL',q:'Columna a INT UNIQUE NULL. ¿Se pueden insertar dos filas con a = NULL?',opts:[['Sí',true,'UNIQUE admite varios NULL porque NULL no es igual a NULL.'],['No',false,'Sí se puede.'],['Solo si hay PK',false,'No depende.'],['Da error al crear',false,'Es válido.']],truco:'Para "único y obligatorio": NOT NULL UNIQUE.'},
{id:'dd17',topic:'ddl',type:'match',title:'Tipos de datos',prompt:'Une cada dato con su tipo.',pairs:[['Precio','DECIMAL(10,2)','Dinero exacto.'],['DNI','CHAR(9)','Largo fijo.'],['Nombre','VARCHAR(80)','Largo variable.'],['Fecha de nacimiento','DATE','Fecha sin hora.'],['Fecha y hora de una consulta','DATETIME','Con hora.'],['Descripción larga','TEXT','Texto largo.']],truco:'DECIMAL dinero, CHAR fijo, VARCHAR variable, DATE fecha.'},
{id:'dd18',topic:'ddl',type:'match',title:'ALTER TABLE',prompt:'Une cada orden con lo que hace.',pairs:[['ADD COLUMN','Añade una columna','Nueva.'],['MODIFY','Cambia tipo o NULL','Mismo nombre.'],['CHANGE','Cambia nombre y tipo','Renombra y redefine.'],['DROP FOREIGN KEY','Quita una clave ajena','Por su nombre.'],['RENAME COLUMN','Solo cambia el nombre','MySQL 8.0+.']],truco:'MODIFY = Mismo nombre.'},
{id:'dd19',topic:'ddl',type:'order',title:'Orden de creación',q:'Script de la tienda. ¿En qué orden se crean las tablas para que no falle ninguna FK?',steps:['cliente','producto','pedido (FK a cliente)','linea (FK a pedido y a producto)'],why:'Cada tabla se crea después de aquellas a las que apunta. cliente y producto no apuntan a nadie.',truco:'Primero los que no apuntan a nadie; las intermedias, al final.'},
{id:'dd20',topic:'ddl',type:'short',title:'Escribe: ¿por qué está mal?',q:'Enunciado: "cada reparación la dirige exactamente un mecánico". ¿Por qué está mal esta línea?',code:'mecanico_id INT,',groups:[['not null','vnn','nulo','null'],['obligatori','exactamente','siempre','minimo 1','min 1','un mecanico']],model:'Porque "exactamente un mecánico" significa que la participación es obligatoria (mínimo 1): la FK mecanico_id debe ser NOT NULL (VNN). Sin NOT NULL se admiten reparaciones sin mecánico.',why:'Hay que decir qué falta (NOT NULL) y por qué (es obligatorio según el enunciado).',truco:'Qué está mal + qué regla del enunciado lo exige.'},
{id:'dd21',topic:'ddl',type:'short',title:'Escribe: ¿por qué está mal?',q:'Tabla intermedia de una N:M entre ALUMNO y CURSO. ¿Por qué está mal?',code:'PRIMARY KEY (alumno_id),',groups:[['compuesta','curso_id','las dos','ambas'],['solo un','un solo','una sola','varios','repet']],model:'La CP de la tabla intermedia debe ser compuesta: PRIMARY KEY (alumno_id, curso_id). Con solo alumno_id cada alumno solo podría matricularse en un curso, porque no se podría repetir.',why:'Hay que decir la CP correcta y la consecuencia.',truco:'Error + consecuencia real ("solo podría…").'},
{id:'dd22',topic:'ddl',type:'short',title:'Escribe: ¿por qué está mal?',q:'Enunciado: "el email del usuario no puede repetirse". ¿Por qué está mal?',code:'email VARCHAR(120) NOT NULL,',groups:[['unique','c.alt','alternativa'],['repet','duplic','dos usuarios','mismo email']],model:'Falta UNIQUE (C.Alt): NOT NULL solo obliga a que haya email, pero dos usuarios podrían tener el mismo y el enunciado dice que no puede repetirse.',why:'NOT NULL y UNIQUE son cosas distintas.',truco:'Obligatorio ≠ único.'},

{id:'w-h-grp2', db:'huerto', kind:'select', src:'Boletín 0 Huerto II · ej. 2', title:'Resumen por vecino', prompt:'Para cada vecino con parcelas muestra su dni_vecino, cuántas parcelas tiene, la superficie total y la media por parcela (2 decimales). Ordena por superficie total de mayor a menor.', ref:'SELECT dni_vecino, COUNT(*), SUM(metros), ROUND(AVG(metros), 2) FROM Parcela GROUP BY dni_vecino ORDER BY SUM(metros) DESC', hints:['COUNT, SUM y AVG sobre Parcela agrupando por dni_vecino.']},
{id:'w-h-grp3', db:'huerto', kind:'select', src:'Boletín 0 Huerto II · ej. 3', title:'Vecinos con más de una parcela', prompt:'Muestra solo los vecinos que tienen más de una parcela: dni_vecino, número de parcelas y superficie total. Ordena por número de parcelas de mayor a menor.', ref:'SELECT dni_vecino, COUNT(*), SUM(metros) FROM Parcela GROUP BY dni_vecino HAVING COUNT(*) > 1 ORDER BY COUNT(*) DESC', hints:['Un filtro sobre una cuenta va en HAVING, no en WHERE.']},
{id:'w-h-grp4', db:'huerto', kind:'select', src:'Boletín 0 Huerto II · ej. 6', title:'Dos condiciones de grupo', prompt:'Vecinos con MÁS de 1 parcela Y superficie total mayor de 40 m². Muestra dni_vecino, número de parcelas, superficie total y media (2 decimales), de mayor a menor superficie total.', ref:'SELECT dni_vecino, COUNT(*), SUM(metros), ROUND(AVG(metros), 2) FROM Parcela GROUP BY dni_vecino HAVING COUNT(*) > 1 AND SUM(metros) > 40 ORDER BY SUM(metros) DESC', hints:['HAVING admite AND entre condiciones de agregado.']},

{id:'w-c-grp1', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 11', title:'Ciclistas por equipo', prompt:'Obtén cuántos ciclistas hay en cada equipo (nomeq y la cuenta).', ref:'SELECT nomeq, COUNT(*) FROM ciclista GROUP BY nomeq', hints:['GROUP BY nomeq.']},
{id:'w-c-grp2', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 12', title:'Edad media por equipo', prompt:'Obtén la edad media de los ciclistas de cada equipo.', ref:'SELECT nomeq, AVG(edad) FROM ciclista GROUP BY nomeq', hints:['AVG(edad) agrupando por nomeq.']},
{id:'w-c-grp3', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 13', title:'Puertos por categoría', prompt:'Obtén cuántos puertos hay en cada categoría.', ref:'SELECT categoria, COUNT(*) FROM puerto GROUP BY categoria', hints:['GROUP BY categoria.']},
{id:'w-c-hav1', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 15', title:'Equipos con más de 5 ciclistas', prompt:'Obtén los equipos que tienen más de 5 ciclistas (nomeq y la cuenta).', ref:'SELECT nomeq, COUNT(*) FROM ciclista GROUP BY nomeq HAVING COUNT(*) > 5', hints:['HAVING COUNT(*) > 5.']},
{id:'w-c-hav2', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 16', title:'Equipos con edad media alta', prompt:'Obtén los equipos cuyos ciclistas tienen una edad media superior a 30 años (nomeq y la media).', ref:'SELECT nomeq, AVG(edad) FROM ciclista GROUP BY nomeq HAVING AVG(edad) > 30', hints:['HAVING AVG(edad) > 30.']},
{id:'w-c-hav3', db:'ciclismo', kind:'select', src:'Boletín 1 Ciclismo · ej. 17', title:'Maillots por ciclista', prompt:'Obtén cuántos maillots llevó cada ciclista y muestra solo los que llevaron más de 10 (dorsal y la cuenta).', ref:'SELECT dorsal, COUNT(*) FROM llevar GROUP BY dorsal HAVING COUNT(*) > 10', hints:['La tabla es llevar.']},

{id:'w-i-3', db:'instituto', kind:'select', src:'Boletín extra · ej. 6', title:'Orden por apellido', prompt:'Lista todos los alumnos ordenados por apellido1 de forma ascendente.', ref:'SELECT * FROM alumno ORDER BY apellido1 ASC', hints:['ASC es el orden por defecto, pero conviene escribirlo.']},

{id:'w-i-5', db:'instituto', kind:'select', src:'Boletín extra · ej. 9', title:'Alumnos con teléfono', prompt:'Obtén todos los alumnos que tienen teléfono.', ref:'SELECT * FROM alumno WHERE telefono IS NOT NULL', hints:['Con NULL no se usa «=»: IS NOT NULL.']},
{id:'w-i-6', db:'instituto', kind:'select', src:'Boletín extra · ej. 10', title:'Nombre completo ordenado', prompt:"Obtén el nombre completo (nombre, apellido1 y apellido2 en una sola columna llamada 'nombre_completo'), ordenado alfabéticamente. Ojo: apellido2 puede ser NULL.", ref:["SELECT CONCAT_WS(' ', nombre, apellido1, apellido2) AS nombre_completo FROM alumno ORDER BY nombre_completo", "SELECT CONCAT(nombre, ' ', apellido1, ' ', IFNULL(apellido2, '')) AS nombre_completo FROM alumno ORDER BY nombre_completo"], aliases:['nombre_completo'], hints:['CONCAT devuelve NULL si algún trozo es NULL: usa CONCAT_WS o IFNULL.']},
{id:'w-i-7', db:'instituto', kind:'select', src:'Boletín extra · ej. 11', title:'Nacidos en los 90', prompt:'Obtén los alumnos nacidos entre 1990 y 1999 (ambos años incluidos), ordenados por fecha de nacimiento.', ref:["SELECT * FROM alumno WHERE YEAR(fecha_nacimiento) BETWEEN 1990 AND 1999 ORDER BY fecha_nacimiento", "SELECT * FROM alumno WHERE fecha_nacimiento BETWEEN '1990-01-01' AND '1999-12-31' ORDER BY fecha_nacimiento"], hints:['YEAR(fecha) devuelve el año.']},
{id:'w-i-8', db:'instituto', kind:'select', src:'Boletín extra · ej. 12', title:'Edad aproximada', prompt:'Obtén nombre, apellidos y edad (aproximada) de cada alumno, ordenados por edad de mayor a menor.', ref:["SELECT nombre, apellido1, apellido2, TIMESTAMPDIFF(YEAR, fecha_nacimiento, CURDATE()) FROM alumno ORDER BY TIMESTAMPDIFF(YEAR, fecha_nacimiento, CURDATE()) DESC", "SELECT nombre, apellido1, apellido2, YEAR(CURDATE()) - YEAR(fecha_nacimiento) FROM alumno ORDER BY YEAR(CURDATE()) - YEAR(fecha_nacimiento) DESC"], hints:['TIMESTAMPDIFF(YEAR, fecha_nacimiento, CURDATE()) o YEAR(CURDATE()) - YEAR(fecha_nacimiento).']},
{id:'w-i-9', db:'instituto', kind:'select', src:'Boletín extra · ej. 13', title:'Apellido que empieza por S', prompt:"Obtén los alumnos cuyo primer apellido empieza por 'S', ordenados alfabéticamente por apellido1.", ref:"SELECT * FROM alumno WHERE apellido1 LIKE 'S%' ORDER BY apellido1", hints:['LIKE \'S%\'.']},
{id:'w-i-10', db:'instituto', kind:'select', src:'Boletín extra · ej. 15', title:'Sin teléfono o repetidores', prompt:'Obtén los alumnos que NO tienen teléfono o que son repetidores, ordenados por apellido1.', ref:"SELECT * FROM alumno WHERE telefono IS NULL OR es_repetidor = 'sí' ORDER BY apellido1", hints:['OR entre las dos condiciones; IS NULL para el teléfono.']},
{id:'w-i-11', db:'instituto', kind:'select', src:'Boletín extra · ej. 18', title:'Los 3 más jóvenes', prompt:'Obtén los 3 alumnos más jóvenes (nacidos más recientemente): nombre, apellido1 y fecha de nacimiento.', ref:'SELECT nombre, apellido1, fecha_nacimiento FROM alumno ORDER BY fecha_nacimiento DESC LIMIT 3', hints:['Los más jóvenes son los de fecha de nacimiento MÁS reciente: DESC.']},
